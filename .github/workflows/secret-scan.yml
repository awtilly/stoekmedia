# Secret scanning with gitleaks (security audit 2026-10-27, section 7).
# main is served live on stoekmedia.com by GitHub Pages, so a committed secret
# is public the moment it's pushed. This catches what GitHub push protection
# doesn't (e.g. a password typed into a doc, which is how the App Review login
# leaked). Config: .gitleaks.toml; known historical findings: .gitleaksignore.
#
# - push / pull_request: scans only the new commits, plus the full working tree.
# - Actions → secret-scan → "Run workflow" with full_history=true: every commit
#   on every branch.
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: "Scan every commit on every branch"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gitleaks binary is used directly (pinned + checksum-verified) rather
      # than gitleaks-action, which needs a paid license key on org accounts.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Scan commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FULL_HISTORY: ${{ github.event.inputs.full_history }}
        run: |
          if [ "$FULL_HISTORY" = "true" ]; then
            RANGE="--all"
          elif [ "$EVENT" = "pull_request" ]; then
            RANGE="${PR_BASE}..HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] \
               && ! echo "$BEFORE" | grep -qE '^0+$' \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}..HEAD"
          else
            # New branch, force-push or manual run: everything not yet on the default branch.
            RANGE="origin/${DEFAULT_BRANCH}..HEAD"
          fi
          echo "Scanning commits: $RANGE"
          gitleaks git --redact --verbose --log-opts="$RANGE" .

      - name: Scan working tree
        run: gitleaks dir --redact --verbose .
