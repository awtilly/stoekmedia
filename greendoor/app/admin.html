<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — GreenDoor</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/greendoor/css/greendoor.css">
</head>
<body class="gd-light">

  <!-- Navigation -->
  <nav class="nav scrolled">
    <div class="container">
      <a href="/greendoor/app/dashboard" class="nav-logo gd-nav-logo"><span class="gd-green">Green</span><span class="gd-door">Door</span><small class="gd-by-line">by stoekmedia</small></a>
      <ul class="nav-links">
        <li><a href="/greendoor/app/dashboard">Dashboard</a></li>
        <li><a href="/greendoor/app/clients">Clients</a></li>
        <li><a href="/greendoor/app/calendar">Calendar</a></li>
        <li id="nav-admin-tab"><a href="/greendoor/app/admin" class="gd-nav-active">Admin</a></li>
        <li><a href="/greendoor/app/settings">Settings</a></li>
        <li class="nav-crm-divider"></li>
        <li><span id="nav-user-name" class="nav-user-name"></span></li>
        <li><button class="nav-logout-btn" onclick="handleLogout()">Logout</button></li>
      </ul>
      <button class="nav-toggle" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <div class="gd-page">
    <div class="gd-content">

      <!-- Loading -->
      <div id="admin-loading" class="gd-loading">
        <div class="gd-spinner gd-spinner-lg"></div>
        <span class="gd-loading-text">Loading admin panel...</span>
      </div>

      <div id="admin-content" class="gd-hidden">

        <div class="gd-welcome">
          <h1>Admin <em>Panel</em></h1>
        </div>

        <!-- Platform Stats -->
        <div class="gd-stats-row" style="margin-bottom: var(--space-lg);">
          <div class="gd-stat-card">
            <div class="gd-stat-number" id="admin-realtors">0</div>
            <div class="gd-stat-label">Active Realtors</div>
          </div>
          <div class="gd-stat-card">
            <div class="gd-stat-number" id="admin-clients">0</div>
            <div class="gd-stat-label">Total Clients</div>
          </div>
          <div class="gd-stat-card">
            <div class="gd-stat-number" id="admin-files">0</div>
            <div class="gd-stat-label">Total Files</div>
          </div>
          <div class="gd-stat-card">
            <div class="gd-stat-number" id="admin-properties">0</div>
            <div class="gd-stat-label">Properties Tracked</div>
          </div>
        </div>

        <!-- Realtor Management -->
        <div class="gd-section-header">
          <h2 style="font-family: var(--font-display); font-size: 1.5rem; font-weight: 500;">Realtor Management</h2>
          <button class="gd-btn gd-btn-primary" onclick="openInviteModal()">Invite Realtor</button>
        </div>

        <div class="gd-table-wrap">
          <table class="gd-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Company</th>
                <th>Status</th>
                <th>Active</th>
                <th>Clients</th>
                <th>Last Login</th>
              </tr>
            </thead>
            <tbody id="realtors-tbody">
              <tr><td colspan="7" style="text-align:center; color: var(--color-text-muted);">No realtors found.</td></tr>
            </tbody>
          </table>
        </div>

        <!-- Invite Realtor Modal -->
        <div class="gd-modal-overlay" id="invite-modal">
          <div class="gd-modal" style="max-width: 440px;">
            <div class="gd-modal-header">
              <h3>Invite Realtor</h3>
              <button class="gd-modal-close" onclick="closeInviteModal()">&times;</button>
            </div>
            <div class="gd-modal-body">
              <div class="gd-form-group">
                <label for="invite-name">Full Name</label>
                <input type="text" id="invite-name" class="gd-input" placeholder="Jane Smith">
              </div>
              <div class="gd-form-group">
                <label for="invite-email">Email</label>
                <input type="email" id="invite-email" class="gd-input" placeholder="jane@example.com">
              </div>
              <div class="gd-form-group">
                <label for="invite-company">Company <span style="color: #9ca3af;">(optional)</span></label>
                <input type="text" id="invite-company" class="gd-input" placeholder="ABC Realty">
              </div>
              <p id="invite-error" class="gd-login-error"></p>
            </div>
            <div class="gd-modal-footer">
              <button class="gd-btn gd-btn-ghost" onclick="closeInviteModal()">Cancel</button>
              <button class="gd-btn gd-btn-primary" id="invite-send-btn" onclick="sendInvite()">Send Invite</button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="/assets/js/main.js"></script>
  <script type="module" src="/greendoor/js/auth.js"></script>
  <script type="module" src="/greendoor/js/admin.js"></script>
</body>
</html>
