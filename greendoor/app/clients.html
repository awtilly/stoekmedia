<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Clients — GreenDoor</title>
  <!-- PWA -->
  <link rel="manifest" href="/greendoor/app/manifest.json">
  <meta name="theme-color" content="#22c55e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/greendoor/app/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/greendoor/css/greendoor.css">
</head>
<body class="gd-light">

  <!-- Sidebar -->
  <aside class="gd-sidebar" id="gd-sidebar">
    <div class="gd-sidebar-logo">
      <a href="/greendoor/app/dashboard">
        <span class="gd-green">Green</span><span class="gd-door">Door</span>
      </a>
    </div>
    <nav class="gd-sidebar-nav">
      <a href="/greendoor/app/dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="/greendoor/app/clients" class="gd-nav-active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Clients</span>
      </a>
      <a href="/greendoor/app/listings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Listings</span>
      </a>
      <a href="/greendoor/app/calendar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Calendar</span>
      </a>
      <a href="/greendoor/app/admin" id="nav-admin-tab" style="display:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Admin</span>
      </a>
      <a href="/greendoor/app/settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="gd-sidebar-user">
      <div class="gd-sidebar-avatar" id="sidebar-avatar"></div>
      <span class="gd-sidebar-user-name" id="nav-user-name"></span>
      <button class="gd-sidebar-logout" onclick="handleLogout()" title="Logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>
  <div class="gd-sidebar-overlay" onclick="document.getElementById('gd-sidebar').classList.remove('open')"></div>

  <!-- Topbar -->
  <header class="gd-topbar">
    <button class="gd-sidebar-toggle" onclick="document.getElementById('gd-sidebar').classList.toggle('open')" aria-label="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 class="gd-topbar-title">Clients</h1>
  </header>

  <div class="gd-app-layout">
  <div class="gd-page">
    <div class="gd-content">

      <div class="gd-page-header">
        <h2>Clients</h2>
      </div>

      <!-- Top Bar -->
      <div class="gd-top-bar">
        <input type="text" id="search-input" class="gd-input gd-search-input" placeholder="Search by name, email, or phone...">
        <select id="status-filter" class="gd-input gd-filter-select">
          <option value="">All Statuses</option>
          <option value="lead">Lead</option>
          <option value="active_buyer">Active Buyer</option>
          <option value="active_seller">Active Seller</option>
          <option value="under_contract">Under Contract</option>
          <option value="closed">Closed</option>
          <option value="inactive">Inactive</option>
        </select>
        <button class="gd-btn" onclick="openImportModal()">Import CSV</button>
        <button class="gd-btn gd-btn-primary" onclick="openAddModal()">+ Add Client</button>
      </div>

      <!-- Loading -->
      <div id="clients-loading" class="gd-loading">
        <div class="gd-spinner gd-spinner-lg"></div>
        <span class="gd-loading-text">Loading clients...</span>
      </div>

      <!-- Table -->
      <div id="clients-table-wrap" class="gd-table-wrap gd-hidden">
        <table class="gd-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Status</th>
              <th class="gd-hide-mobile">Budget</th>
              <th class="gd-hide-mobile">Location</th>
              <th class="gd-hide-mobile">Last Activity</th>
              <th style="width:40px;"></th>
            </tr>
          </thead>
          <tbody id="clients-tbody"></tbody>
        </table>
      </div>

      <!-- Empty State -->
      <div id="clients-empty" class="gd-empty gd-hidden">
        <div class="gd-empty-icon">&#128100;</div>
        <div class="gd-empty-text">No clients yet</div>
        <div class="gd-empty-sub">Click "+ Add Client" to get started.</div>
      </div>

    </div>
  </div>
  </div><!-- /gd-app-layout -->

  <!-- Add Client Modal -->
  <div id="add-modal" class="gd-modal-overlay">
    <div class="gd-modal">
      <div class="gd-modal-header">
        <h3>Add New Client</h3>
        <button class="gd-modal-close" onclick="closeAddModal()" aria-label="Close">&times;</button>
      </div>
      <div class="gd-modal-body">
        <div class="gd-form-row">
          <div class="gd-form-group">
            <label for="add-fullName">Full Name *</label>
            <input type="text" id="add-fullName" class="gd-input" required>
          </div>
          <div class="gd-form-group">
            <label for="add-email">Email *</label>
            <input type="email" id="add-email" class="gd-input" required>
          </div>
        </div>
        <div class="gd-form-row">
          <div class="gd-form-group">
            <label for="add-phone">Phone</label>
            <input type="tel" id="add-phone" class="gd-input">
          </div>
          <div class="gd-form-group">
            <label for="add-status">Status</label>
            <select id="add-status" class="gd-input">
              <option value="lead" selected>Lead</option>
              <option value="active_buyer">Active Buyer</option>
              <option value="active_seller">Active Seller</option>
              <option value="under_contract">Under Contract</option>
              <option value="closed">Closed</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="gd-form-row">
          <div class="gd-form-group">
            <label for="add-budgetMin">Budget Min</label>
            <input type="number" id="add-budgetMin" class="gd-input" placeholder="200000">
          </div>
          <div class="gd-form-group">
            <label for="add-budgetMax">Budget Max</label>
            <input type="number" id="add-budgetMax" class="gd-input" placeholder="500000">
          </div>
        </div>
        <div class="gd-form-row">
          <div class="gd-form-group">
            <label for="add-timeline">Timeline</label>
            <select id="add-timeline" class="gd-input">
              <option value="">Select...</option>
              <option value="Immediate">Immediate</option>
              <option value="1-3 Months">1-3 Months</option>
              <option value="3-6 Months">3-6 Months</option>
              <option value="6-12 Months">6-12 Months</option>
              <option value="Just Browsing">Just Browsing</option>
            </select>
          </div>
          <div class="gd-form-group">
            <label for="add-source">Source</label>
            <select id="add-source" class="gd-input">
              <option value="">Select...</option>
              <option value="Referral">Referral</option>
              <option value="Online Ad">Online Ad</option>
              <option value="Open House">Open House</option>
              <option value="Website">Website</option>
              <option value="Social Media">Social Media</option>
              <option value="Cold Call">Cold Call</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="gd-form-group">
          <label for="add-notes">Notes</label>
          <textarea id="add-notes" class="gd-input" rows="3" placeholder="Any initial notes..."></textarea>
        </div>
      </div>
      <div class="gd-modal-footer">
        <button class="gd-btn" onclick="closeAddModal()">Cancel</button>
        <button class="gd-btn gd-btn-primary" onclick="saveClient()">Save Client</button>
      </div>
    </div>
  </div>

  <!-- AI Summary Popover -->
  <div id="ai-popover" class="gd-ai-popover">
    <div class="gd-ai-popover-header">
      <span>&#10024; Sage Summary</span>
      <button class="gd-ai-popover-close" onclick="closeAiPopover()" aria-label="Close">&times;</button>
    </div>
    <div id="ai-popover-content" class="gd-ai-popover-content">
      <div class="gd-spinner"></div>
    </div>
  </div>

  <!-- CSV Import Modal -->
  <div id="csv-import-modal" class="gd-modal-overlay">
    <div class="gd-modal gd-modal-md">
      <div class="gd-modal-header">
        <h3>Import Clients</h3>
        <button class="gd-modal-close" onclick="closeImportModal()" aria-label="Close">&times;</button>
      </div>
      <div class="gd-modal-body"></div>
      <div class="gd-modal-footer">
        <button id="csv-back-btn" class="gd-btn" onclick="csvPrevStep()" style="display:none;">Back</button>
        <div class="gd-flex-1"></div>
        <button id="csv-next-btn" class="gd-btn gd-btn-primary" onclick="csvNextStep()" disabled>Next</button>
      </div>
    </div>
  </div>

  <script src="/assets/js/main.js"></script>
  <script type="module" src="/greendoor/js/auth.js"></script>
  <script type="module" src="/greendoor/js/csv-import.js"></script>
  <script type="module" src="/greendoor/js/clients.js"></script>
  <script type="module" src="/greendoor/js/tour.js"></script>
  <script type="module" src="/greendoor/js/bottom-tabs.js"></script>
  <script type="module" src="/greendoor/js/chatbot.js"></script>
</body>
</html>
