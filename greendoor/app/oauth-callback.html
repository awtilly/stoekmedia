<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting your account — GreenDoor</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../css/greendoor.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .oauth-card { max-width: 28rem; width: 100%; padding: 2rem; text-align: center; }
    .spinner { width: 2.5rem; height: 2.5rem; border: 3px solid #e5e7eb; border-top-color: #22c55e; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .oauth-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .oauth-actions { margin-top: 1.5rem; display: flex; gap: 0.5rem; justify-content: center; }
  </style>
</head>
<body class="gd-light">
  <div class="gd-card oauth-card" id="oauth-card">
    <div class="spinner"></div>
    <h2 id="oauth-title">Connecting your Gmail account…</h2>
    <p class="gd-text-muted-sm" id="oauth-detail">Hang tight, this usually takes a couple of seconds.</p>
  </div>

  <script type="module">
    import { auth, functions, httpsCallable } from "../js/firebase-config.js";
    import { onAuthStateChanged } from "../js/vendor/firebase.js";

    // Must match OAUTH_STATE_KEY in js/settings.js (connectGmail).
    const OAUTH_STATE_KEY = "gd-oauth-state";

    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const error = params.get("error");
    const returnedState = params.get("state");
    const cardEl = document.getElementById("oauth-card");

    // One-shot: read and clear the state stashed by connectGmail, whatever the outcome.
    const expectedState = sessionStorage.getItem(OAUTH_STATE_KEY);
    sessionStorage.removeItem(OAUTH_STATE_KEY);

    // Only follow same-origin relative paths ("/..."), never "//host" or "/\host".
    const storedReturnTo = sessionStorage.getItem("oauthReturnTo");
    const returnTo = storedReturnTo && /^\/(?![\/\\])/.test(storedReturnTo) ? storedReturnTo : "settings.html";

    // All UI below is built with DOM APIs + textContent so no URL parameter or
    // server-supplied string is ever parsed as HTML.
    function el(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      Object.assign(node, props);
      node.append(...children);
      return node;
    }

    function renderCard(nodes) {
      cardEl.textContent = "";
      cardEl.append(...nodes);
    }

    function showError(message, recoverable = true) {
      const actions = el("div", { className: "oauth-actions" });
      if (recoverable) {
        actions.append(el("a", { className: "gd-btn gd-btn-primary", href: "settings.html", textContent: "Back to settings" }));
      }
      renderCard([
        el("div", { className: "oauth-icon", textContent: "⚠️" }),
        el("h2", { textContent: "Could not connect Gmail" }),
        el("p", { className: "gd-text-muted-sm", textContent: String(message) }),
        actions
      ]);
    }

    function showSuccess(email) {
      renderCard([
        el("div", { className: "oauth-icon", textContent: "✅" }),
        el("h2", { textContent: "Gmail connected" }),
        el("p", { className: "gd-text-muted-sm" }, [
          "Emails will now send from ",
          el("strong", { textContent: String(email) }),
          ". Redirecting you back…"
        ])
      ]);
      setTimeout(() => { window.location.href = returnTo; }, 1500);
    }

    if (error) {
      // OAuth error codes are short tokens (e.g. access_denied); don't echo arbitrary text.
      const errorCode = /^[A-Za-z0-9_.-]{1,64}$/.test(error) ? error : "unknown_error";
      showError(`Google returned an error: ${errorCode}. You can try again any time.`);
    } else if (!code) {
      showError("Missing authorization code — please try connecting again from Settings.");
    } else if (!returnedState || !expectedState || returnedState !== expectedState) {
      // CSRF / login-binding check failed: never exchange a code this browser didn't request.
      showError("This sign-in link didn't match a connection request from this browser session. Please start again from Settings.");
    } else {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          showError("You need to be signed in to GreenDoor to connect Gmail. Please sign in and try again.", false);
          return;
        }
        try {
          const fn = httpsCallable(functions, "exchangeGoogleAuthCode");
          const { data } = await fn({
            code,
            redirectUri: `${window.location.origin}/greendoor/app/oauth-callback.html`
          });
          if (data?.connected && data.email) {
            sessionStorage.removeItem("oauthReturnTo");
            showSuccess(data.email);
          } else {
            showError("Unexpected response from server. Please try again.");
          }
        } catch (e) {
          console.error("OAuth exchange failed:", e);
          const msg = e?.message || "Something went wrong while finishing the connection.";
          showError(msg);
        }
      });
    }
  </script>
</body>
</html>
