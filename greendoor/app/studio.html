:root{
  --ink:#343F41; --ink-deep:#22292B; --ink-soft:#5C686A;
  --sage-deep:#344C36; --sage:#8DA383; --sage-pale:#C8D9BB;
  --cream:#F4F1EA; --stone:#E3DED3; --white:#fff;
  --brass:#B08D57; --brass-deep:#8A6D40;
  --fd:'Playfair Display',Georgia,serif; --fb:'Montserrat',Helvetica,Arial,sans-serif;
  --panelw:344px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
/* min-height breaks the circular dependency when the host frame sizes itself
   from content: without it, 100%/vh can resolve against a collapsed iframe. */
body{font-family:var(--fb);background:#DEDACF;color:var(--ink);display:flex;flex-direction:column;
     height:100vh;min-height:760px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}

/* ---------- header ---------- */
header{background:var(--ink);color:#fff;padding:8px 14px;display:flex;align-items:center;gap:14px;flex:0 0 auto}
header #home{background:none;border:0;padding:4px 6px;margin-left:-6px;display:flex;align-items:center;gap:14px;
     cursor:pointer;color:#fff;border-radius:3px;flex:0 0 auto}
header #home:hover{background:rgba(255,255,255,.10)}
header #home img{height:30px;flex:0 0 auto}
header #home .t{font-family:var(--fd);font-size:16px;flex:0 0 auto}
header #home[aria-pressed=true]{background:rgba(255,255,255,.16)}
.tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:flex-end}
.tabs::-webkit-scrollbar{display:none}
.tab{background:rgba(255,255,255,.09);color:#fff;border:0;padding:8px 13px;font:600 10px/1 var(--fb);
     letter-spacing:.13em;text-transform:uppercase;cursor:pointer;border-radius:2px;white-space:nowrap}
.tab[aria-selected=true]{background:var(--brass)}

main{flex:1;display:flex;min-height:0}
body.dashboard main{display:none}
body.dashboard #tabs{display:none}

/* ---------- dashboard ---------- */
#dash{flex:1;min-height:0;overflow-y:auto;padding:26px 30px 40px;background:#DEDACF}
#dash[hidden]{display:none}
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
       max-width:1240px;margin:0 auto 20px}
.dhead h1{font:400 27px/1.1 var(--fd);color:var(--ink);margin:0}
.dhead p{font:600 9.5px/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:8px 0 0}
.dtools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.dtools input[type=text]{width:220px}
.dtools select{width:auto;padding-right:26px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px;max-width:1240px;margin:0 auto}

.card{background:#fff;border:1px solid var(--stone);border-radius:3px;overflow:hidden;cursor:pointer;
      display:flex;flex-direction:column;text-align:left;padding:0;font:inherit;color:inherit;position:relative;
      transition:box-shadow .13s,transform .13s}
.card:hover{box-shadow:0 6px 20px rgba(52,63,65,.16);transform:translateY(-2px)}
.card .thumb{height:142px;background:#C9C3B6 center/cover no-repeat;position:relative;flex:0 0 auto}
.card .thumb.empty{display:grid;place-items:center;background:var(--cream)}
.card .thumb.empty img{width:52px;opacity:.5}
.card .pill{position:absolute;left:9px;top:9px;font:600 8px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;
     color:#fff;padding:5px 8px;border-radius:2px;background:var(--brass)}
.card .body{padding:12px 13px 13px;flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .addr{font:400 15px/1.25 var(--fd);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .city{font:500 9px/1.3 var(--fb);letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .price{font:600 13px/1 var(--fd);color:var(--ink);margin-top:5px}
.card .specs{font:500 10px/1.4 var(--fb);color:var(--ink-soft);letter-spacing:.04em;text-transform:none}
.card .foot{display:flex;align-items:center;gap:6px;margin-top:9px;padding-top:8px;border-top:1px solid #F0EDE6}
.card .kind{font:600 8px/1 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--sage-deep);
     background:#EDF2E8;padding:5px 7px;border-radius:2px}
.card .when{font:400 10px/1 var(--fb);color:var(--ink-soft);margin-left:auto;white-space:nowrap}
.card .acts{position:absolute;right:7px;top:7px;display:flex;gap:4px;opacity:0;transition:opacity .13s}
.card:hover .acts,.card:focus-within .acts{opacity:1}
.card .acts button{width:26px;height:26px;border:0;border-radius:2px;background:rgba(28,34,36,.72);color:#fff;
     cursor:pointer;font-size:12px;line-height:1;display:grid;place-items:center;padding:0}
.card .acts button:hover{background:var(--ink)}

.newcard{border:1px dashed var(--ink-soft);background:transparent;display:grid;place-items:center;min-height:214px;
     cursor:pointer;border-radius:3px;font:600 10px/1 var(--fb);letter-spacing:.15em;text-transform:uppercase;
     color:var(--ink-soft);gap:8px;padding:0}
.newcard:hover{border-color:var(--brass);color:var(--brass);background:rgba(255,255,255,.4)}
.newcard b{font:400 30px/1 var(--fd);display:block}
.dempty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--ink-soft);font-size:13px;line-height:1.6}

/* ---------- panel ---------- */
aside{width:var(--panelw);flex:0 0 var(--panelw);background:#fff;border-right:1px solid var(--stone);
      display:flex;flex-direction:column;min-height:0}
.ptabs{display:flex;border-bottom:1px solid var(--stone);flex:0 0 auto}
.ptab{flex:1;background:none;border:0;padding:11px 4px;font:600 9.5px/1 var(--fb);letter-spacing:.14em;
      text-transform:uppercase;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent}
.ptab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brass)}
.pbody{flex:1;overflow-y:auto;padding:15px}
.pfoot{flex:0 0 auto;border-top:1px solid var(--stone);padding:9px 12px;display:flex;gap:6px;flex-wrap:wrap;background:#FBFAF7}

/* ---------- stage ---------- */
.stage{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px;min-width:0}
.stagebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:100%}
.chip{background:#fff;border:1px solid var(--stone);padding:7px 12px;font:600 9.5px/1 var(--fb);
      letter-spacing:.11em;text-transform:uppercase;cursor:pointer;border-radius:2px;color:var(--ink-soft);white-space:nowrap}
.chip[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{background:var(--brass);color:#fff;border:0;padding:9px 15px;font:600 9.5px/1 var(--fb);
     letter-spacing:.13em;text-transform:uppercase;cursor:pointer;border-radius:2px;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn.sm{padding:7px 11px;font-size:9px}
.btn:disabled{opacity:.5;cursor:wait}

/* ---------- form ---------- */
.grp{margin:0 0 6px}
.grp>h4{margin:14px 0 8px;font:600 9px/1 var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--brass)}
.grp:first-child>h4{margin-top:0}
label{display:block;margin-bottom:9px}
label>span{display:block;font:600 9px/1.4 var(--fb);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
input[type=text],select,textarea{width:100%;padding:8px 9px;border:1px solid var(--stone);border-radius:2px;
     font:400 13px/1.35 var(--fb);color:var(--ink);background:#fff}
textarea{resize:vertical;min-height:62px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--sage);outline-offset:-1px}
.row{display:flex;gap:7px}.row>*{flex:1}
.hint{font-size:10px;color:var(--ink-soft);line-height:1.45;margin:-2px 0 9px}

/* photo slots */
.ph{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.ph .slot{width:66px;height:50px;border:1px dashed var(--stone);border-radius:2px;background:#FAF9F6 center/cover no-repeat;
     display:grid;place-items:center;font-size:9px;color:var(--ink-soft);cursor:pointer;position:relative;overflow:hidden}
.ph .slot.on{border-style:solid}
.ph .slot.sel{outline:2px solid var(--brass);outline-offset:1px}
.ph .slot.drop{border-color:var(--sage-deep);background-color:#EDF2E8}
.ph .slot b{position:absolute;top:0;right:2px;color:#fff;text-shadow:0 0 3px #000;font-size:12px;display:none}
.ph .slot.on b{display:block}

/* import a listing */
.imp{margin-bottom:10px}
.imp textarea{min-height:56px;font-size:12px}
.imp .btn{margin-top:6px;width:100%}
.imp .hint{margin-top:7px}

/* storage / import notice */
#notice{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(560px,92vw);
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:3px;font-size:12px;line-height:1.5;
  box-shadow:0 6px 24px rgba(0,0,0,.28);z-index:60;display:none}

/* swatches + toggles */
.sw{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.sw button{width:30px;height:30px;border:1px solid rgba(0,0,0,.16);border-radius:2px;cursor:pointer;padding:0}
.sw button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.tog{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #F0EDE6;cursor:pointer;
     font-size:12px;font-weight:500}
.tog:last-child{border-bottom:0}
.tog input{width:15px;height:15px;accent-color:var(--sage-deep);cursor:pointer;flex:0 0 auto;margin:0}
input[type=range]{width:100%;accent-color:var(--brass)}
input[type=color]{width:100%;height:32px;padding:2px;border:1px solid var(--stone);border-radius:2px;background:#fff;cursor:pointer}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:56px;background:#fff;border:1px solid var(--stone);border-radius:2px;padding:8px 4px;
     font:600 9px/1.2 var(--fb);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- artboard ---------- */
.wrap{margin:0 auto;overflow:hidden}
.art{transform-origin:top left}
.art{position:relative;overflow:hidden;font-family:var(--fb);box-shadow:0 10px 40px rgba(0,0,0,.18)}
.art[data-s=square]{width:1080px;height:1080px}
.art[data-s=portrait]{width:1080px;height:1350px}
.art[data-s=story]{width:1080px;height:1920px}
.art[data-s=link]{width:1200px;height:630px}
.art[data-s=fbcover]{width:1640px;height:624px}
.art[data-s=linkedin]{width:1584px;height:396px}
.art[data-s=flyer]{width:816px;height:1056px}
.art[data-s=postcard]{width:576px;height:864px}

.photo{background-color:#C9C3B6;background-size:cover;background-repeat:no-repeat;position:relative}
.photo.scrim:after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(28,34,36,.46) 0%,rgba(28,34,36,.04) 30%,rgba(28,34,36,.30) 58%,rgba(28,34,36,.86) 100%)}
.photo.wash:after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(24,30,32,.62) 0%,rgba(24,30,32,.50) 45%,rgba(24,30,32,.74) 100%)}
.badge{position:absolute;z-index:2;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.oh{position:absolute;z-index:2;text-align:center;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.pricel{font-family:var(--fd);font-weight:600;letter-spacing:-.02em;line-height:1}
.addr{font-family:var(--fd);line-height:1.2}
.city{letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.specs{display:flex;align-items:center;letter-spacing:.13em;text-transform:uppercase;font-weight:600;flex-wrap:wrap}
.specs i{border-radius:50%;display:inline-block;font-style:normal;flex:0 0 auto}
.hook{font-family:var(--fd);font-style:italic;line-height:1.34}
.agentbar{display:flex;align-items:center}
.agentbar .nm{font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.comp{line-height:1.45}
.statgrid{display:grid;grid-template-columns:1fr 1fr}
.stat .v{font-family:var(--fd);font-weight:600;line-height:1}
.stat .l{letter-spacing:.15em;text-transform:uppercase;font-weight:600}
.stat .d{font-weight:600;letter-spacing:.06em}
.quote{font-family:var(--fd);font-style:italic;line-height:1.32}
.eyebrow{font-weight:600;letter-spacing:.22em;text-transform:uppercase}

/* export + print */
body.export{background:#fff;overflow:hidden}
body.export header,body.export aside,body.export .stagebar,body.export #notice,body.export #dash{display:none!important}
body.export main{display:block}
body.export .stage{padding:0;display:block;overflow:visible}
body.export .wrap{width:auto!important;height:auto!important;overflow:visible}
body.export .art{transform:none!important}
body.export .art{box-shadow:none;margin:0}
@media print{
  html,body{overflow:visible;height:auto}
  body{background:#fff} header,aside,.stagebar,.pfoot,#notice,#dash{display:none!important}
  main{display:block} .stage{padding:0;display:block;overflow:visible}
  .wrap{width:auto!important;height:auto!important;overflow:visible}
  .art{transform:none!important}
  .art{box-shadow:none;margin:0}
  @page{margin:0}
}

/* ---------- mobile ---------- */
@media (max-width:860px){
  html,body{overflow:visible;height:auto}
  #dash{padding:16px 14px 30px}
  .dhead{align-items:stretch}
  .dtools{width:100%}
  .dtools input[type=text]{flex:1;width:auto}
  .dgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px}
  .card .thumb{height:104px}
  .card .acts{opacity:1}
  body{display:block;min-height:100%}
  main{display:flex;flex-direction:column;min-height:0}
  .stage{order:1;flex:none;padding:12px;overflow:visible;display:block;text-align:center}
  .stagebar{margin-bottom:12px;justify-content:center}
  .wrap{margin:0 auto}
  aside{order:2;width:100%;flex:none;border-right:0;border-top:1px solid var(--stone);display:block}
  .ptabs{position:sticky;top:0;background:#fff;z-index:5}
  .pbody{flex:none;overflow:visible;max-height:none}
  .pfoot{position:sticky;bottom:0;z-index:5}
  header{flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:20}
  .tabs{justify-content:flex-start;width:100%;order:3}
  .chip,.btn{padding:9px 12px}
}
</style>

const clone = o => JSON.parse(JSON.stringify(o));
/* Every path that loads state — boot, Open, Restore, Reset — goes through
   normalize(). A backup written by an older version, or hand-edited, is
   missing keys the renderers dereference without guarding; skipping this on
   Open/Restore was crashing the app on a valid-looking file. */
function normalize(v){
  const s = Object.assign(clone(DEFAULTS), v && typeof v==='object' ? v : {});
  if(!Array.isArray(s.photos) || s.photos.length!==4) s.photos=[null,null,null,null];
  if(!Array.isArray(s.focal)  || s.focal.length!==4)  s.focal=clone(DEFAULTS.focal);
  s.focal = s.focal.map(f => Array.isArray(f)&&f.length===2 ? [+f[0]||0,+f[1]||0] : [50,50]);
  s.show  = Object.assign(clone(DEFAULTS.show), s.show && typeof s.show==='object' ? s.show : {});
  if(!THEMES[s.theme]) s.theme=DEFAULTS.theme;
  if(typeof s.accent!=='string' || !s.accent) s.accent=DEFAULTS.accent;
  s.scale = Math.min(1.25, Math.max(0.8, +s.scale || 1));
  if(!['stack','overlay','split'].includes(s.layout)) s.layout=DEFAULTS.layout;
  return s;
}
let S = (()=>{ try{ return normalize(JSON.parse(localStorage.getItem('ae-studio'))); }catch(e){ return clone(DEFAULTS); } })();

/* ---------- helpers ---------- */
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Stripping every non-digit turned "425k" into $425 and "1.25M" into $1, and
   silently erased "Call for price". Parse what was typed; pass through what is
   not a number. */
const money = v => {
  const s = String(v ?? '').trim();
  if(!s) return '';
  const m = s.match(/^\$?\s*([\d,]*\.?\d+)\s*([kKmM])?\s*$/);
  if(!m) return s;
  let n = parseFloat(m[1].replace(/,/g,''));
  if(!isFinite(n)) return s;
  if(m[2]) n *= (m[2].toLowerCase()==='k' ? 1e3 : 1e6);
  return '$' + n.toLocaleString('en-US',{maximumFractionDigits:0});
};
const T  = () => THEMES[S.theme] || THEMES.cream;
const AC = () => S.accent || '#B08D57';
/* Autofit. Long labels or a short-wide canvas pushed the last block — the
   disclosure Missouri requires on every advertisement — past the bottom of the
   artboard, where overflow:hidden cut it off. draw() shrinks FIT until the
   content fits, so nothing can be silently cropped out of a design. */

}

       + ` · Information deemed reliable but not guaranteed · Equal Housing Opportunity`;
}

/* Blank fields used to render as "0 Sq Ft" with a dangling separator. Build the
   row from the parts that actually have a value, then join with dots. */
function specRow(u,t){
  if(!has('specs')) return '';
  const sqft=String(S.sqft??'').replace(/\D/g,'');
  const parts=[
    String(S.beds??'').trim()  && `${esc(S.beds)} Bed`,

    sqft && `${Number(sqft).toLocaleString()} Sq Ft`,

  if(!parts.length) return '';
  const dot=`<i style="width:${u*.11}px;height:${u*.11}px;background:${AC()}"></i>`;
  return `<div class="specs" style="font-size:${u*.74}px;gap:${u*.8}px;color:${t.ink}">`

/* ============================================================
   IMPORT A LISTING
   ------------------------------------------------------------
   The Studio is one file that has to work with the internet off, opened
   straight off her desktop. It therefore cannot go and read a Zillow page:
   a page served from file:// has no origin the portals will answer to, and
   every one of them blocks automated reads besides. Two things it CAN do,
   both entirely offline:

     1. A listing LINK. Zillow, Redfin, Realtor.com, Homes.com and Compass
        all spell the address into the URL, so a pasted link fills in the
        street, city, state and ZIP. Price and room counts are not in a URL
        and cannot be recovered from one.

     2. The listing TEXT. She opens the listing, selects the page, copies,
        pastes it in here -- price, beds, baths, square feet, lot, address
        and status all come across. This is the path that fills everything.

   Nothing is written until she has seen what was found and said yes.
   ============================================================ */

/* Street types, so "5243-Winona-Ave-Saint-Louis-MO-63109" can be cut in the
   right place. The last one in the slug ends the street and starts the city. */
const ST_TYPE = new Set(('aly alley ave avenue bend blf blvd boulevard bnd brg bridge '+
 'brk brook byp bypass cir circle clb cmn commons cres crossing xing ct court ctr '+
 'center cv cove creek crk dr drive est estates expy expressway fwy freeway gdns '+
 'gardens gln glen grn green grv grove hbr harbor hl hill hls hills holw hollow '+
 'hts heights hwy highway jct junction knl knoll lk lake lndg landing ln lane loop '+
 'mdw mdws meadow meadows mnr manor mtn mountain orch orchard park pkwy parkway '+
 'pl place plz plaza pt point rd road rdg ridge rnch ranch row run shr shore shrs '+
 'shores spg spgs sq square st street sta station ter terrace tpke turnpike trl '+
 'trail vlg village vly valley vw view walk way wells woods xrd').split(' '));
/* Abbreviations that just as often OPEN a place name -- St Louis, St Charles,
   Ft Worth, Mt Vernon. Only trusted to end the street when nothing else can. */
const AMBIG_TYPE = new Set(['st','ft','mt','pt']);
const UNIT_WORD = new Set(['apt','unit','ste','suite','#','no','lot','bldg','fl','floor','rm']);
const cap = w => w ? w[0].toUpperCase()+w.slice(1) : w;
const titleish = str => str.split(/\s+/).map(w =>
  /^[A-Z0-9#.'-]+$/.test(w) && w.length<=3 ? w : (/[a-z]/.test(w)&&/[A-Z]/.test(w) ? w : cap(w.toLowerCase()))
).join(' ');

/* Split "5243 Winona Ave Saint Louis" into street and city. */
function splitStreetCity(words){
  const cands=[];
  for(let i=1;i<words.length;i++)
    if(ST_TYPE.has(words[i].toLowerCase().replace(/\./g,''))) cands.push(i);
  let cut=-1;
  for(let j=cands.length-1;j>=0;j--){
    const i=cands[j];
    // skip a St/Ft/Mt that has a word after it, unless it is the only candidate
    if(j>0 && AMBIG_TYPE.has(words[i].toLowerCase().replace(/\./g,'')) && i+1<words.length) continue;
    cut=i; break;
  }
  if(cut<0) return {street:words.join(' '), town:''};
  // carry a unit designator along with the street
  if(UNIT_WORD.has((words[cut+1]||'').toLowerCase().replace(/[#.]/g,''))) cut+=2;
  else if(/^#/.test(words[cut+1]||'')) cut+=1;
  return {street:words.slice(0,cut+1).join(' '), town:words.slice(cut+1).join(' ')};
}

function parseListingUrl(url){
  let u; try{ u=new URL(url); }catch(e){ return null; }
  const segs=decodeURIComponent(u.pathname).split('/').filter(Boolean);
  const out={};

  // realtor.com uses underscores: 5243-Winona-Ave_Saint-Louis_MO_63109_M123-456
  const rl=segs.find(x=>/_[A-Z]{2}_\d{5}/.test(x));
  if(rl){
    const [street,town,st,zip]=rl.split('_');
    out.addr=titleish(street.replace(/-/g,' '));
    out.city=`${titleish(town.replace(/-/g,' '))}, ${st} ${zip}`;
    return out;
  }
  // redfin: /MO/Saint-Louis/5243-Winona-Ave-63109/home/12345678
  const ri=segs.findIndex(x=>/^[A-Z]{2}$/.test(x));
  if(ri>=0 && segs[ri+1] && segs[ri+2] && /-\d{5}$/.test(segs[ri+2])){
    out.addr=titleish(segs[ri+2].replace(/-\d{5}$/,'').replace(/-/g,' '));
    out.city=`${titleish(segs[ri+1].replace(/-/g,' '))}, ${segs[ri]} ${segs[ri+2].slice(-5)}`;
    return out;
  }
  // zillow / compass / homes.com: one slug carrying ...-ST-ZIP (zip sometimes absent)
  const slug=segs.filter(x=>/^\d/.test(x)&&x.includes('-'))
                 .sort((a,b)=>b.length-a.length)[0]
          || segs.filter(x=>x.includes('-')).sort((a,b)=>b.length-a.length)[0];
  if(!slug) return null;
  let words=slug.replace(/_(rb|zpid).*$/i,'').split('-').filter(Boolean);
  let zip='', st='';
  if(/^\d{5}$/.test(words[words.length-1])) zip=words.pop();
  if(/^[A-Za-z]{2}$/.test(words[words.length-1]||'')) st=words.pop().toUpperCase();
  // a real address slug carries a house number, or at least a state and ZIP
  if(!words.length) return null;
  if(!/^\d/.test(words[0]) && !(st&&zip)) return null;
  const {street,town}=splitStreetCity(words);
  out.addr=titleish(street);
  const tail=[titleish(town), [st,zip].filter(Boolean).join(' ')].filter(Boolean);
  if(tail.length) out.city = tail.join(', ');
  return out.addr ? out : null;
}

const STATUS_WORDS=[
  [/back\s+on\s+(the\s+)?market/i,'Back on Market'],
  [/coming\s+soon/i,               'Coming Soon'],
  [/open\s+(house|sat|sun|today)/i,'Open House'],
  [/(under\s+contract|pending|contingent|accepting\s+backup)/i,'Under Contract'],
  [/(price\s+(cut|reduced|improve)|reduced\s+price)/i,'Price Improved'],
  [/(just\s+)?sold|closed\s+on/i,  'Just Sold'],
  [/(just\s+listed|new\s+listing|newly\s+listed|for\s+sale|active)/i,'Just Listed'],
];

function parseListingText(txt){
  const t=txt.replace(/ /g,' ');
  const out={};

  // price: first dollar figure that could be a sale price and is not a monthly payment
  const money_re=/\$\s?([\d,]{5,})/g; let m;
  while((m=money_re.exec(t))){
    const n=+m[1].replace(/,/g,'');
    if(n<25000 || n>90000000) continue;
    if(/^\s*\/?\s*(mo|month|yr)/i.test(t.slice(m.index+m[0].length))) continue;
    out.price=String(n); break;
  }

  const bd=t.match(/(\d+(?:\.\d)?)\s*(?:bds?\b|beds?\b|bedrooms?\b)/i);            if(bd) out.beds=bd[1];
  const ba=t.match(/(\d+(?:\.\d+)?)\s*(?:ba\b|baths?\b|bathrooms?\b)/i);           if(ba) out.baths=ba[1];
  const sf=t.match(/([\d,]{3,})\s*(?:sq\.?\s?ft\.?|sqft|square\s+feet)(?!\s*lot)/i); if(sf) out.sqft=sf[1].replace(/,/g,'');

  const ac=t.match(/([\d.,]+)\s*acres?\b/i);
  const lotf=t.match(/([\d,]{3,})\s*(?:sq\.?\s?ft\.?|sqft)\s*lot/i);
  if(ac) out.lot=ac[1].replace(/,/g,'');
  else if(lotf) out.lot=(+lotf[1].replace(/,/g,'')/43560).toFixed(2);

  const ad=t.match(/(\d+[\w.'\- ]{2,60}?),\s*([A-Za-z .'\-]{2,40}),\s*([A-Z]{2})\.?\s*(\d{5})(?:-\d{4})?/);
  if(ad){ out.addr=ad[1].trim(); out.city=`${ad[2].trim()}, ${ad[3]} ${ad[4]}`; }

  for(const [re,label] of STATUS_WORDS) if(re.test(t)){ out.status=label; break; }

  const blurb=t.match(/(?:what'?s\s+special|about\s+this\s+home|property\s+description|description)\s*[:\n]\s*([\s\S]{40,900}?)(?:\n\s*\n|$)/i);
  if(blurb) out.desc=blurb[1].replace(/\s+/g,' ').trim();

  return out;
}

const IMPORT_LABEL={price:'Price',beds:'Beds',baths:'Baths',sqft:'Sq ft',lot:'Lot (ac)',
                    addr:'Address',city:'City / State / ZIP',status:'Status',desc:'Description'};
function importListing(raw){
  const text=String(raw||'').trim();
  if(!text) return notice('Paste a listing link, or the copied listing page, first.');

  const looksUrl=/^https?:\/\/\S+$/i.test(text);
  const found=Object.assign({},
    looksUrl ? (parseListingUrl(text)||{}) : {},
    looksUrl ? {} : parseListingText(text));

  // a pasted page usually still contains its own link -- read that too
  if(!looksUrl && (!found.addr || !found.city)){
    const link=text.match(/https?:\/\/\S*(zillow|redfin|realtor|homes|compass)\.com\S*/i);
    if(link) Object.assign(found, parseListingUrl(link[0])||{}, found);
  }

  const keys=Object.keys(found).filter(k=>found[k]);
  if(!keys.length){
    return notice(looksUrl
      ? 'That link did not carry an address I could read. Copy the listing page itself and paste that instead.'
      : 'Nothing recognisable in that text. Select the whole listing page, copy, and paste it here.');
  }
  const lines=keys.map(k=>`  ${IMPORT_LABEL[k]||k}: ${k==='price'?money(found[k]):found[k]}`).join('\n');
  const missing=['price','beds','baths','sqft','addr'].filter(k=>!found[k]).map(k=>IMPORT_LABEL[k]);
  if(!confirm(`Import this?\n\n${lines}\n`
      + (missing.length?`\nNot found — fill these in yourself: ${missing.join(', ')}\n`:'')
      + `\nPhotos never come across. Drag them onto the photo slots, or copy and paste them in.`)) return;

  Object.assign(S, found);
  save(); buildPanel(); draw();
  notice(`Imported ${keys.length} field${keys.length===1?'':'s'}. Check them before you post.`);
}

/* A phone photo is 3-8 MB as a data URL and browser storage tops out near 5 MB
   for the whole app. save() used to swallow the quota error, so she could work
   all afternoon, close the tab, and find nothing had been remembered. Photos
   are now down-sampled on the way in, and a save that still will not fit
   persists everything except the photos and says so out loud. */
const PHOTO_MAX = 2000;          // long edge, px -- 300 DPI at flyer size
const PHOTO_Q   = 0.82;
function downscale(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onerror=()=>rej(new Error('could not read that file'));
    r.onload=()=>{
      const img=new Image();
      img.onerror=()=>res(r.result);   // SVG and anything canvas will not take: keep as-is
      img.onload=()=>{
        const k=Math.min(1, PHOTO_MAX/Math.max(img.width,img.height));
        if(k===1 && r.result.length < 900*1024) return res(r.result);
        const c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        try{ res(c.toDataURL('image/jpeg',PHOTO_Q)); }catch(e){ res(r.result); }
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
let _warned=false;
function notice(msg){
  let n=$('#notice');
  if(!n){ n=document.createElement('div'); n.id='notice'; document.body.appendChild(n); }
  n.textContent=msg; n.style.display='block';
  clearTimeout(notice._t); notice._t=setTimeout(()=>{ n.style.display='none'; }, 9000);
}
function save(){
  try{ localStorage.setItem('ae-studio', JSON.stringify(S)); return true; }
  catch(e){
    try{
      localStorage.setItem('ae-studio', JSON.stringify(Object.assign({},S,{photos:[null,null,null,null]})));
      if(!_warned){ _warned=true;
        notice('These photos are too big for the browser to remember. Your design is saved; the photos are not. Use Backup to keep everything.'); }
    }catch(e2){
      if(!_warned){ _warned=true; notice('Browser storage is full — nothing is being saved. Use Backup.'); }
    }
    return false;
  }
}

  }

    return `<label><span>${f.l}</span><div class="ph" id="ph">${slots}</div>
      <div class="hint">Click a photo to adjust how it is cropped. Click the × to remove it.</div></label>${adj}`;
  }
  const v=esc(S[f.k]??'');

  return `<label${f.half?' style="flex:1"':''}><span>${f.l}</span>${inp}</label>`;
}
function fieldsHtml(fs){

function buildPanel(){

async function setPhoto(i,file){
  if(!file || !/^image\//.test(file.type||'')) return;
  try{
    S.photos[i]=await downscale(file);
    S.focal[i]=[50,50]; focusPhoto=i; save(); buildPanel(); draw();
  }catch(e){ notice('That file could not be read as an image.'); }
}
function wirePanel(){
  const p=$('#panel');
  p.oninput = e=>{
    const el=e.target;
    if(el.id==='impbox') return;
    if(el.dataset.k){ S[el.dataset.k]=el.value; save(); if(el.dataset.k==='status'){buildPanel();} draw(); return; }
    if(el.dataset.focal){ const f=S.focal[focusPhoto]||[50,50];
      if(el.dataset.focal==='x') f[0]=+el.value; else f[1]=+el.value;
      S.focal[focusPhoto]=f; save(); draw();
      const sl=p.querySelector(`.slot[data-i="${focusPhoto}"]`);
      if(sl) sl.style.backgroundPosition=`${f[0]}% ${f[1]}%`;
      return; }
    if(el.id==='scale'){ S.scale=+el.value/100; save(); draw();
      el.closest('label').querySelector('span').textContent=el.value+'%'; return; }
    if(el.id==='accpick'){ S.accent=el.value; save(); buildPanel(); draw(); return; }
  };
  p.onchange = e=>{
    const el=e.target;
    if(el.dataset.show!==undefined){ S.show[el.dataset.show]=el.checked; save(); draw(); }
  };
  p.onclick = e=>{
    const b=e.target.closest('button');
    if(b){
      if(b.id==='impgo'){ importListing(p.querySelector('#impbox').value); return; }
      if(b.dataset.th){ S.theme=b.dataset.th; save(); buildPanel(); draw(); return; }
      if(b.dataset.ac){ S.accent=b.dataset.ac; save(); buildPanel(); draw(); return; }
      if(b.dataset.lay){ S.layout=b.dataset.lay; save(); buildPanel(); draw(); return; }
    }
    const x=e.target.dataset.x;
    if(x!==undefined){ e.stopPropagation(); S.photos[+x]=null; S.focal[+x]=[50,50]; save(); buildPanel(); draw(); return; }
    const sl=e.target.closest('[data-i]');
    if(sl){
      const i=+sl.dataset.i;
      if(S.photos[i]){ focusPhoto=i; buildPanel(); return; }
      const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
      inp.onchange=async ()=>{ const f=inp.files[0]; if(!f) return; await setPhoto(i,f); };
      inp.click();
    }
  };
  /* Drag a photo straight out of Finder, Photos, or a listing page onto a slot. */
  p.ondragover = e=>{ const sl=e.target.closest?.('[data-i]'); if(!sl) return;
    e.preventDefault(); e.dataTransfer.dropEffect='copy'; sl.classList.add('drop'); };
  p.ondragleave = e=>{ e.target.closest?.('[data-i]')?.classList.remove('drop'); };
  p.ondrop = async e=>{
    const sl=e.target.closest?.('[data-i]'); if(!sl) return;
    e.preventDefault(); sl.classList.remove('drop');
    const f=[...(e.dataTransfer.files||[])].find(x=>/^image\//.test(x.type));
    if(f) return setPhoto(+sl.dataset.i, f);
    notice('Drop an image file. A photo dragged off a web page comes across as a link, not a picture — save it first, then drop the file.');
  };
}
/* Copy an image anywhere, press Cmd-V here, and it lands in the selected slot. */
addEventListener('paste', e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||'')) return;
  if(ptab!=='content' || !(T_REG[cur].fields||[]).some(f=>f.t==='photos')) return;
  const it=[...(e.clipboardData?.items||[])].find(x=>/^image\//.test(x.type));
  if(!it) return;
  e.preventDefault();

});

/* ---------- draw ---------- */
/* True when any block reaches past the artboard edge. The artboard is drawn at
   full size and CSS-scaled to the stage, so measurements are divided back out
   by the live scale factor rather than trusting the transform string. */
function clipped(art){
  const W=art.offsetWidth, H=art.offsetHeight;
  if(!W||!H) return false;
  const b=art.getBoundingClientRect(), k=b.width/W;
  if(!k) return false;
  for(const el of art.querySelectorAll('.comp,.agentbar,.statgrid,.hook,.quote,.specs,.addr,.pricel')){
    const r=el.getBoundingClientRect();
    if((r.bottom-b.top)/k > H+1 || (r.right-b.left)/k > W+1) return true;
  }
  return false;
}
function draw(){
  const art=$('#art');
  art.dataset.s=curSize; art.dataset.t=cur;
  art.style.background=T().bg;
  FIT=1;
  art.innerHTML = T_REG[cur].render(curSize);
  for(let i=0; i<8 && clipped(art); i++){
    FIT -= 0.05;
    art.innerHTML = T_REG[cur].render(curSize);
  }
  fit();
}
function fit(){
  const sz=SZ[curSize], stage=$('.stage');
  const narrow = window.innerWidth <= 860;
  const avail  = stage.clientWidth - (narrow?24:36);
  const availH = narrow ? Math.max(300, window.innerHeight*0.62)
                        : Math.max(320, stage.clientHeight-120);
  const k=Math.min(1, avail/sz.w, availH/sz.h);
  const w=$('#wrap');
  $('#art').style.transform=`scale(${k})`;
  w.style.width=Math.round(sz.w*k)+'px'; w.style.height=Math.round(sz.h*k)+'px';
}

/* ---------- export ----------
   Two delivery paths. Opened from a file on her computer, a normal download
   link works. Opened from a shared link, the page has to ask the viewer to
   save, so we use the downloads capability when it is there. */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let _dl;
async function downloader(){
  if(_dl!==undefined) return _dl;
  try{ _dl = (typeof claude!=='undefined' && claude && claude.use) ? await claude.use('downloads') : null; }
  catch(e){ _dl=null; }
  return _dl;
}
function dataUrlToBlob(u){
  const [head,b64]=u.split(',');
  const mime=(head.match(/:(.*?);/)||[,'image/png'])[1];
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function deliver(filename, dataUrl){
  const d=await downloader();
  if(d){
    for(let attempt=0; attempt<2; attempt++){
      try{ await d.save({filename, data:dataUrlToBlob(dataUrl)}); return 'saved'; }
      catch(err){
        const c=err && err.code;
        if(c==='declined') return 'declined';
        if(c==='rate_limited'){ await sleep(1600); continue; }
        if(c==='too_large'){ alert('That image is too large to save. Try turning the text size down, or use a smaller size.'); return 'failed'; }
        break;
      }
    }
  }
  const a=document.createElement('a'); a.download=filename; a.href=dataUrl; a.click();
  return 'saved';
}
function fileName(size){
  const base=(cur==='listing'||cur==='openhouse') ? (S.addr||'listing') : T_REG[cur].label;
  return `ae-${String(base).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}-${size}.png`;
}
async function exportPng(size){
  const prev=curSize;
  if(size!==curSize){ curSize=size; buildSizes(); draw(); await sleep(280); }
  const sz=SZ[curSize];
  const url=await htmlToImage.toPng($('#art'), {pixelRatio:sz.pr||1, width:sz.w, height:sz.h,
    style:{transform:'none'}, cacheBust:true});
  const r=await deliver(fileName(curSize), url);
  if(prev!==curSize){ curSize=prev; buildSizes(); draw(); }
  return r;
}
$('#dl').onclick = async e=>{
  const b=e.target, t=b.textContent; b.disabled=true; b.textContent='Rendering…';
  try{ await exportPng(curSize); }catch(err){ alert('Export failed: '+err.message); }
  b.disabled=false; b.textContent=t;
};
$('#dlall').onclick = async e=>{
  const b=e.target, t=b.textContent; b.disabled=true;
  const list=T_REG[cur].sizes.filter(s=>!SZ[s].pdf);
  try{

    }

};
$('#pr').onclick = async ()=>{
  if(await downloader()){

/* ============================================================
   PROJECTS
   ------------------------------------------------------------
   One record per house she is marketing, not per design. A record carries
   the whole editor state plus the handful of fields anything outside this
   file would want -- see projectCard() for that projection, which is the
   single place to touch when these records move into a bigger system.

   Storage is versioned. v1 was a flat { "name": state } map written by the
   prompt-based Save; it is migrated on first read and left readable by
   older copies of the file through the same shape in Backup.
   ============================================================ */
const PKEY='ae-projects';
const uid = () => 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function readStore(){
  let raw; try{ raw=JSON.parse(localStorage.getItem(PKEY)||'null'); }catch(e){ raw=null; }
  if(!raw || typeof raw!=='object') return {v:2, items:{}};
  if(raw.v===2 && raw.items) return raw;
  // Migrate once and commit. Left lazy, every read would mint fresh ids and the
  // id a card was drawn with would no longer resolve when it was clicked.
  const store={v:2, items:readStoreFrom(raw)};
  try{ localStorage.setItem(PKEY, JSON.stringify(store)); }catch(e){}
  return store;
}
// v1: { "5243 Winona Avenue": {...state} }
function readStoreFrom(map){
  const items={}; let t=Date.now();
  for(const [name,state] of Object.entries(map||{})){
    if(!state || typeof state!=='object') continue;
    const id=uid(); items[id]={id, name, autoName:null, template:'listing', created:t, updated:t, state};
    t -= 1000;
  }
  return items;
}
function writeStore(store){
  try{ localStorage.setItem(PKEY, JSON.stringify(store)); return true; }
  catch(e){ notice('Browser storage is full — that project was not saved. Use Backup, then delete a project you no longer need.'); return false; }
}
const projects = () => readStore().items;
const CKEY='ae-current';
/* Which record the editor is on. Persisted, or a reload would make the next
   Save a second copy of the same house instead of an update. */
let curProject = (()=>{ try{ const id=localStorage.getItem(CKEY);
  return id && readStore().items[id] ? id : null; }catch(e){ return null; } })();
function setCurProject(id){
  curProject=id;
  try{ id ? localStorage.setItem(CKEY,id) : localStorage.removeItem(CKEY); }catch(e){}
}

/* The outward-facing view of a record. Everything the dashboard draws, and
   everything another system would read, comes from here. */
/* Every template shares one state object, so a Market design still carries the
   sample listing's beds and price. Only surface a field the template actually
   puts on the artboard. */
const uses = (tpl,key) => (T_REG[tpl]?.fields||[]).some(f=>f.k===key);
function projectCard(rec){
  const st  = rec.state || {};
  const tpl = T_REG[rec.template] ? rec.template : 'listing';
  const on  = k => uses(tpl,k) ? (st[k] || '') : '';
  return {
    id:       rec.id,
    name:     rec.name || st.addr || 'Untitled',
    address:  on('addr'),
    city:     on('city'),
    status:   on('status'),
    price:    on('price'),
    beds:     on('beds'), baths: on('baths'), sqft: on('sqft'),
    template: tpl,
    accent:   st.accent || DEFAULTS.accent,
    photo:    (st.photos||[])[0] || null,
    focal:    ((st.focal||[])[0]) || [50,50],
    created:  rec.created || 0,
    updated:  rec.updated || rec.created || 0,
  };
}

/* ============================================================
   GREENDOOR BRIDGE
   ------------------------------------------------------------
   GreenDoor keeps listings in Firestore under the collection "listings",
   owner-scoped by addedBy, with the address as a NESTED object. These two
   functions are the whole translation layer between that record and the flat
   state this file edits. Nothing else in the Studio needs to change when the
   dashboard moves into the CRM -- point saveProject/openProject at Firestore
   and run records through these on the way in and out.

   GreenDoor status is a five-value enum; the Studio's seven marketing statuses
   collapse onto it, and expand back out to the most likely one.
   ============================================================ */
const GD_STATUS = {'Coming Soon':'coming_soon','Just Listed':'active','Open House':'active',
                   'Under Contract':'pending','Price Improved':'active','Just Sold':'sold',
                   'Back on Market':'active'};
const GD_STATUS_BACK = {coming_soon:'Coming Soon', active:'Just Listed', pending:'Under Contract',
                        sold:'Just Sold', withdrawn:'Coming Soon'};
const num = v => { const n=Number(String(v??'').replace(/[^0-9.]/g,'')); return isFinite(n)&&n?n:null; };

/* "St. Louis, MO 63109" -> {city, state, zip} */
function splitCityLine(line){
  const m=String(line||'').match(/^\s*(.*?)\s*,\s*([A-Za-z]{2})\.?\s*(\d{5})?/);
  return m ? {city:m[1]||'', state:(m[2]||'').toUpperCase(), zip:m[3]||''}
           : {city:String(line||'').trim(), state:'', zip:''};
}

/* Studio project -> GreenDoor listing document (minus addedBy/createdAt, which
   only the CRM can set). photos come out as data URLs and have to be uploaded
   to Storage before they are written -- Firestore will not take them as-is. */
function toGreenDoorListing(rec){
  const st=rec.state||{}, loc=splitCityLine(st.city);
  const price=num(st.price), sqft=num(st.sqft);
  const out={
    address:{ full:[st.addr, st.city].filter(Boolean).join(', '), street:st.addr||'',
              city:loc.city, state:loc.state, zip:loc.zip,
              county:'', neighborhood:'', lat:null, lng:null },
    listingPrice: price,
    bedrooms:     num(st.beds),
    bathrooms:    num(st.baths),
    squareFeet:   sqft,
    lotSize:      st.lot ? `${st.lot} acres` : '',
    status:       GD_STATUS[st.status] || 'active',
    description:  st.desc || '',
    notes:        st.hook || '',
    photos:       (st.photos||[]).filter(Boolean),
  };
  if(price && sqft) out.pricePerSqft = Math.round(price/sqft);
  return out;
}

/* GreenDoor listing document -> Studio state patch. Photos are Storage URLs;
   they are handed back untouched so the caller can decide whether to fetch
   them (a remote URL will render on screen but will not survive a PNG export). */
function fromGreenDoorListing(l){
  const a=l.address||{};
  return {
    addr:   a.street || a.full || '',
    city:   [a.city, [a.state, a.zip].filter(Boolean).join(' ')].filter(Boolean).join(', '),
    price:  l.listingPrice!=null ? String(l.listingPrice) : '',
    beds:   l.bedrooms  !=null ? String(l.bedrooms)  : '',
    baths:  l.bathrooms !=null ? String(l.bathrooms) : '',
    sqft:   l.squareFeet!=null ? String(l.squareFeet): '',
    lot:    String(l.lotSize||'').replace(/[^0-9.]/g,''),
    status: GD_STATUS_BACK[l.status] || 'Just Listed',
    desc:   l.description || '',
  };
}

/* Everything a host page needs, in one place, so nothing has to reach into
   this file's internals. */
window.aeStudio = {
  projects, projectCard, openProject, saveProject,
  toGreenDoorListing, fromGreenDoorListing,
  parseListingUrl, parseListingText, importListing,
  get state(){ return clone(S); },
  load(patch){ S=normalize(Object.assign(clone(S), patch||{})); save(); buildPanel(); draw(); },
};

function saveProject(id){
  const store=readStore();
  const now=Date.now();
  if(id && store.items[id]){
    const rec=store.items[id];
    rec.state=clone(S); rec.template=cur; rec.updated=now;
    if(S.addr && rec.name===rec.autoName) { rec.name=S.addr; rec.autoName=S.addr; }
    if(!writeStore(store)) return null;
    return id;
  }
  const name=(S.addr || T_REG[cur].label || 'Untitled').trim();
  const rec={id:uid(), name, autoName:name, template:cur, created:now, updated:now, state:clone(S)};
  store.items[rec.id]=rec;
  if(!writeStore(store)) return null;
  return rec.id;
}
function openProject(id){
  const rec=readStore().items[id];
  if(!rec) return notice('That project is gone.');
  S=normalize(rec.state); setCurProject(id); focusPhoto=0;
  if(T_REG[rec.template]) cur=rec.template;
  if(!T_REG[cur].sizes.includes(curSize)) curSize=T_REG[cur].sizes[0];
  save(); showDash(false);
  buildTabs(); buildSizes(); buildPanel(); draw();
  notice(`Opened ${rec.name}.`);
}

$('#save').onclick = ()=>{

/* ---------- dashboard ---------- */
let dashSort='updated', dashQuery='';
const KIND_LABEL = k => (T_REG[k]||{}).label || k;

function whenText(ts){
  if(!ts) return '';
  const mins=Math.round((Date.now()-ts)/60000);
  if(mins<1)    return 'just now';
  if(mins<60)   return mins+' min ago';
  const hrs=Math.round(mins/60);
  if(hrs<24)    return hrs+' hr ago';
  const days=Math.round(hrs/24);
  if(days<7)    return days+' day'+(days===1?'':'s')+' ago';
  return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function cardHtml(c){

    ? `<div class="thumb" style="background-image:url('${c.photo}');background-position:${c.focal[0]}% ${c.focal[1]}%">`

  const specs=[c.beds&&`${esc(c.beds)} bd`, c.baths&&`${esc(c.baths)} ba`,
               c.sqft&&`${Number(String(c.sqft).replace(/\D/g,'')||0).toLocaleString()} sqft`]
              .filter(Boolean).join('  ·  ');
  return `<div class="card" data-id="${c.id}" tabindex="0" role="button" aria-label="Open ${esc(c.name)}">
    ${thumb}${c.status?`<span class="pill" style="background:${c.accent}">${esc(c.status)}</span>`:''}</div>
    <div class="acts">
      <button data-act="rename" data-id="${c.id}" title="Rename">&#9998;</button>
      <button data-act="dup"    data-id="${c.id}" title="Duplicate">&#10697;</button>
      <button data-act="del"    data-id="${c.id}" title="Delete">&#10005;</button>
    </div>
    <div class="body">
      <div class="addr">${esc(c.address || c.name)}</div>
      ${c.city?`<div class="city">${esc(c.city)}</div>`:''}
      ${c.price?`<div class="price">${money(c.price)}</div>`:''}
      ${specs?`<div class="specs">${specs}</div>`:''}
      <div class="foot"><span class="kind">${esc(KIND_LABEL(c.template))}</span>
        <span class="when">${whenText(c.updated)}</span></div>
    </div></div>`;
}
function buildDash(){
  const all=Object.values(projects()).map(projectCard);
  const q=dashQuery.trim().toLowerCase();
  const list=all.filter(c=>!q || [c.name,c.address,c.city,c.status,KIND_LABEL(c.template)]
                              .join(' ').toLowerCase().includes(q));
  const num = v => Number(String(v).replace(/[^0-9.]/g,'')) || 0;
  list.sort((a,b)=>
      dashSort==='addr'    ? (a.address||a.name).localeCompare(b.address||b.name)
    : dashSort==='price'   ? num(b.price)-num(a.price)
    : dashSort==='created' ? b.created-a.created
    :                        b.updated-a.updated);

  $('#dcount').textContent = all.length
    ? `${all.length} project${all.length===1?'':'s'}${q?` · ${list.length} match${list.length===1?'':'es'}`:''}`
    : 'Nothing saved yet';
  $('#dgrid').innerHTML =
    `<button class="newcard" id="dnewcard"><b>+</b>New design</button>` +
    (list.length ? list.map(cardHtml).join('')
     : all.length ? `<div class="dempty">Nothing matches “${esc(dashQuery)}”.</div>`
     : `<div class="dempty">Build a design, then press <b>Save</b> at the bottom of the panel.<br>
        Every house you save shows up here.</div>`);
}
function showDash(on){
  document.body.classList.toggle('dashboard', on);
  $('#dash').hidden = !on;
  $('#home').setAttribute('aria-pressed', String(on));
  if(on) buildDash(); else fit();
}
$('#home').onclick = ()=> showDash($('#dash').hidden);
$('#dnew').onclick = ()=>{
  const keep={agentName:S.agentName,agentTitle:S.agentTitle,phone:S.phone,email:S.email,site:S.site,
              brokerage:S.brokerage,brokerPhone:S.brokerPhone,license:S.license,
              theme:S.theme,accent:S.accent};
  S=normalize(Object.assign(clone(DEFAULTS), keep, {photos:[null,null,null,null]}));
  setCurProject(null); focusPhoto=0; cur='listing'; curSize='square';
  save(); showDash(false); buildTabs(); buildSizes(); buildPanel(); draw();
  notice('Blank listing. Paste a link or the listing page at the top of the panel to fill it in.');
};
$('#dsearch').oninput = e=>{ dashQuery=e.target.value; buildDash(); };
$('#dsort').onchange  = e=>{ dashSort=e.target.value; buildDash(); };
$('#dgrid').onclick = e=>{
  const a=e.target.closest('[data-act]');
  if(a){
    e.stopPropagation();
    const store=readStore(), rec=store.items[a.dataset.id];
    if(!rec) return;
    if(a.dataset.act==='rename'){
      const n=prompt('Name this project:', rec.name); if(!n) return;
      rec.name=n.trim(); rec.autoName=null; rec.updated=Date.now();
    } else if(a.dataset.act==='dup'){
      const copy=clone(rec); copy.id=uid(); copy.name=rec.name+' copy';
      copy.autoName=null; copy.created=copy.updated=Date.now();
      store.items[copy.id]=copy;
    } else if(a.dataset.act==='del'){
      if(!confirm(`Delete “${rec.name}”? This cannot be undone.`)) return;
      delete store.items[rec.id];
      if(curProject===rec.id) setCurProject(null);
    }
    if(writeStore(store)) buildDash();
    return;
  }
  const card=e.target.closest('.card');
  if(card) return openProject(card.dataset.id);
  if(e.target.closest('#dnewcard')) $('#dnew').onclick();
};
$('#dgrid').onkeydown = e=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const card=e.target.closest('.card');
  if(card){ e.preventDefault(); openProject(card.dataset.id); }
};
addEventListener('keydown', e=>{ if(e.key==='Escape' && !$('#dash').hidden) showDash(false); });
$('#exp').onclick = ()=>{
  const blob=new Blob([JSON.stringify({studio:2, state:S, projects:readStore()},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download='alison-studio-backup.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
};
$('#imp').onclick = ()=>{
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        if(d.state) { S=normalize(d.state); focusPhoto=0; }
        // accept a v2 store or a v1 { name: state } map from an older backup
        if(d.projects) localStorage.setItem(PKEY, JSON.stringify(
          d.projects.v===2 && d.projects.items ? d.projects : {v:2, items:readStoreFrom(d.projects)}));
        save(); buildPanel(); draw(); alert('Restored.');
      }catch(e){ alert('That file could not be read.'); } };
    r.readAsText(f); };
  inp.click();
};
$('#rs').onclick = ()=>{
  if(!confirm('Reset the design back to the sample? Your saved designs and your details are kept.')) return;
  const keep={agentName:S.agentName,agentTitle:S.agentTitle,phone:S.phone,email:S.email,site:S.site,
              brokerage:S.brokerage,brokerPhone:S.brokerPhone,license:S.license};
  S=normalize(Object.assign(clone(DEFAULTS), keep)); focusPhoto=0; save(); buildPanel(); draw();
};

/* ---------- wiring ---------- */
$('#tabs').onclick = e=>{ const b=e.target.closest('[data-k]'); if(!b) return;
  cur=b.dataset.k; if(!T_REG[cur].sizes.includes(curSize)) curSize=T_REG[cur].sizes[0];
  // only correct the layout when this template offers layouts and cannot honour
  // the current one -- templates with no layouts used to reset it to 'stack',
  // so tabbing to Market and back silently threw away her choice
  const lays=T_REG[cur].layouts||[];
  if(lays.length && !lays.includes(S.layout)) S.layout=lays[0];
  focusPhoto=0; buildTabs(); buildSizes(); buildPanel(); draw(); };
$('#sizes').onclick = e=>{ const b=e.target.closest('[data-s]'); if(!b) return;
  curSize=b.dataset.s; buildSizes(); if(ptab==='design') buildPanel(); draw(); };
$('#ptabs').onclick = e=>{ const b=e.target.closest('[data-p]'); if(!b) return;
  ptab=b.dataset.p; buildPtabs(); buildPanel(); };
addEventListener('resize', fit);
buildTabs(); buildSizes(); buildPtabs(); buildPanel(); draw();
</script>
