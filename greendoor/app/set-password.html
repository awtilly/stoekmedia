<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Set Your Password — GreenDoor</title>
  <!-- PWA -->
  <link rel="manifest" href="/greendoor/app/manifest.json">
  <meta name="theme-color" content="#22c55e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/greendoor/app/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/greendoor/css/greendoor.css">
</head>
<body class="gd-light">
  <div class="gd-login-page">
    <div class="gd-login-card">
      <div class="gd-login-logo"><span class="gd-green">Green</span><span class="gd-door">Door</span></div>

      <!-- Loading state -->
      <div id="sp-loading">
        <p class="gd-login-subtitle">Verifying your link...</p>
      </div>

      <!-- Error state (invalid/expired code) -->
      <div id="sp-error" style="display:none;">
        <p class="gd-login-subtitle" id="sp-error-msg">This link is invalid or has expired.</p>
        <div class="gd-login-links" style="justify-content:center;">
          <a href="/greendoor/app/login">Back to Login</a>
        </div>
      </div>

      <!-- Password form -->
      <div id="sp-form" style="display:none;">
        <p class="gd-login-subtitle">Welcome! Create a password for <strong id="sp-email"></strong></p>

        <div class="gd-form-group">
          <label for="sp-password">New Password</label>
          <input type="password" id="sp-password" class="gd-input" placeholder="Choose a strong password" autocomplete="new-password">
        </div>

        <div class="gd-pw-strength" id="sp-strength">
          <div class="gd-pw-strength-bar">
            <div class="gd-pw-strength-fill" id="sp-strength-fill"></div>
          </div>
          <span class="gd-pw-strength-label" id="sp-strength-label"></span>
        </div>

        <ul class="gd-pw-requirements" id="sp-requirements">
          <li id="req-length">At least 8 characters</li>
          <li id="req-upper">One uppercase letter</li>
          <li id="req-lower">One lowercase letter</li>
          <li id="req-number">One number</li>
        </ul>

        <div class="gd-form-group">
          <label for="sp-confirm">Confirm Password</label>
          <input type="password" id="sp-confirm" class="gd-input" placeholder="Re-enter your password" autocomplete="new-password"
                 onkeydown="if(event.key==='Enter') document.getElementById('sp-submit').click()">
        </div>

        <div class="gd-pw-match" id="sp-match"></div>

        <button id="sp-submit" class="gd-btn gd-btn-primary gd-btn-full">Set Password & Continue</button>

        <p id="sp-form-error" class="gd-login-error"></p>
      </div>

      <!-- Success state -->
      <div id="sp-success" style="display:none;">
        <p class="gd-login-subtitle" style="color:#22c55e;">Password set successfully! Signing you in...</p>
      </div>
    </div>
  </div>

  <script type="module" src="/greendoor/js/set-password.js"></script>
</body>
</html>
