<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Madness Draft</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#546A89">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
/* ── Fonts (SIL OFL, files and licenses in fonts/) ── */
@font-face {
  font-family: 'Libre Franklin';
  font-style: normal;
  font-weight: 400 900;
  font-display: swap;
  src: url(fonts/libre-franklin-latin.woff2) format('woff2');
}
@font-face {
  font-family: 'Source Serif 4';
  font-style: normal;
  font-weight: 600 700;
  font-display: swap;
  src: url(fonts/source-serif-4-latin.woff2) format('woff2');
}

/* ── Base / Variables ── */
:root {
  --gold: #A87B00;
  --gold-bg: #FFF4D6;
  --black: #111;
  --white: #fff;
  --g50: #f9f9f9;
  --g100: #f0f0f0;
  --g200: #e0e0e0;
  --g300: #ccc;
  --g400: #999;
  --g500: #777;
  --g600: #555;
  --green: #1A7F37;
  --red: #D0021B;
  --navy: #12305C;
  --navy2: #1F4A8A;
  --rule: #E3E3E3;
  --tint: #F4F4F4;
  --m1: #C8961E;
  --m2: #8D99A6;
  --m3: #A8673A;
  --sans: 'Libre Franklin', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --serif: 'Source Serif 4', Georgia, serif;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  touch-action: manipulation;
}

body {
  font-family: var(--sans);
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-font-smoothing: antialiased;
  background: var(--white);
  color: var(--black);
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* ── Layout ── */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--g200);
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}

.header h1 {
  font-size: 24px;
  font-weight: 800;
}

.header h1 span {
  color: var(--gold);
}

.header-sub {
  font-size: 13px;
  color: var(--g500);
}

/* ── Nav ── */
.top-nav {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--g200);
  margin-bottom: 24px;
  flex-wrap: wrap;
  overflow-x: auto;
}

.top-nav button {
  padding: 10px 18px;
  border: none;
  background: none;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  color: var(--g400);
  border-bottom: 2px solid transparent;
  transition: all .15s;
  white-space: nowrap;
}

.top-nav button.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

.top-nav button:disabled {
  color: var(--g300);
  cursor: not-allowed;
}

.top-nav button:not(:disabled):hover {
  color: var(--gold);
}

/* ── Cards ── */
.card {
  background: var(--white);
  border: 1px solid var(--g200);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}

.label {
  font-size: 11px;
  font-weight: 700;
  color: var(--g500);
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-bottom: 6px;
  display: block;
}

/* ── Inputs ── */
input, select {
  background: var(--white);
  border: 1px solid var(--g200);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 14px;
  font-family: inherit;
  color: var(--black);
  outline: none;
}

input:focus, select:focus {
  border-color: var(--gold);
}

input[type="number"] {
  width: 80px;
}

textarea {
  background: var(--white);
  border: 1px solid var(--g200);
  border-radius: 6px;
  padding: 10px;
  font-size: 13px;
  font-family: monospace;
  color: var(--black);
  outline: none;
  resize: vertical;
  width: 100%;
}

/* ── Buttons ── */
.btn {
  padding: 8px 18px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  font-family: inherit;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--gold);
  color: var(--white);
  border-color: var(--gold);
}

.btn-primary:not(:disabled):hover {
  background: #b38a16;
}

.btn-secondary {
  background: var(--white);
  color: var(--g600);
  border-color: var(--g200);
}

.btn-secondary:not(:disabled):hover {
  border-color: var(--g400);
}

.btn-danger {
  background: var(--white);
  color: var(--red);
  border-color: var(--red);
}

.btn-sm {
  padding: 5px 12px;
  font-size: 12px;
}

.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--g400);
  font-size: 14px;
  padding: 6px;
}

.icon-btn:hover {
  color: var(--black);
}

.icon-btn-danger:hover {
  color: var(--red);
}

/* ── Seeds ── */
.seed-badge {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  flex-shrink: 0;
}

.seed-top {
  background: var(--gold);
  color: #fff;
}

.seed-mid {
  background: #d4b85c;
  color: #fff;
}

.seed-low {
  background: var(--g200);
  color: var(--g600);
}

/* ── Grid / Layout Helpers ── */
.row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
}

.hidden {
  display: none;
}

/* ── Players / Teams ── */
.player-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--g50);
  border-radius: 6px;
  margin-bottom: 4px;
}

.player-num {
  color: var(--gold);
  font-weight: 800;
  font-size: 13px;
  width: 28px;
}

.team-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  padding: 3px 0;
}

/* ── Leaderboard ── */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th, td {
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid var(--g100);
}

th {
  color: var(--g500);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
}

td.pts {
  font-weight: 800;
  color: var(--gold);
  text-align: center;
  font-size: 15px;
}

td.dim {
  color: var(--g300);
  text-align: center;
}

td.val {
  text-align: center;
}

/* ── Live Scores ── */
.live-pulse {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--green);
}

.live-pulse .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}

.score-card {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--g200);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color .15s;
}

.score-card.live {
  border-color: var(--green);
  border-width: 2px;
}

.score-card.final .score-status {
  color: var(--red);
}

.score-teams {
  flex: 1;
  padding: 10px 12px;
}

.score-team-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 14px;
}

.score-team-row.winner {
  font-weight: 800;
}

.score-team-row.loser {
  opacity: .5;
}

.score-team-row img {
  width: 24px;
  height: 24px;
  object-fit: contain;
  flex-shrink: 0;
}

.score-team-row .team-seed {
  font-size: 11px;
  font-weight: 800;
  color: var(--gold);
  min-width: 16px;
  text-align: center;
}

.score-team-row .team-name {
  flex: 1;
  font-size: 13px;
}

.score-team-row .team-record {
  font-size: 11px;
  color: var(--g400);
}

.score-team-row .team-score {
  font-size: 18px;
  font-weight: 800;
  min-width: 32px;
  text-align: right;
}

.score-meta {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 12px;
  min-width: 90px;
  background: var(--g50);
  border-left: 1px solid var(--g200);
  gap: 2px;
}

.score-status {
  font-size: 12px;
  font-weight: 700;
  color: var(--green);
  text-align: center;
}

.score-broadcast {
  font-size: 10px;
  color: var(--g400);
  text-align: center;
}

.score-note {
  font-size: 10px;
  color: var(--gold);
  font-weight: 600;
  text-align: center;
}

.scores-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 8px;
}

.team-logo-sm {
  width: 20px;
  height: 20px;
  object-fit: contain;
  flex-shrink: 0;
}

.import-card {
  background: linear-gradient(135deg, var(--gold-bg) 0%, var(--white) 100%);
  border: 2px dashed var(--gold);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
  cursor: pointer;
  transition: all .2s;
}

.import-card:hover {
  border-style: solid;
  background: var(--gold-bg);
}

.import-card h3 {
  font-size: 16px;
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 4px;
}

.import-card p {
  font-size: 13px;
  color: var(--g500);
  margin-bottom: 12px;
}

.live-filter-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.live-filter-btn {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--g200);
  background: var(--white);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  color: var(--g600);
}

.live-filter-btn.active {
  background: var(--gold);
  color: var(--white);
  border-color: var(--gold);
}

/* ── Settings ── */
.toggle {
  width: 44px;
  height: 24px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  position: relative;
  transition: background .2s;
  flex-shrink: 0;
}

.toggle.on {
  background: var(--gold);
}

.toggle.off {
  background: var(--g200);
}

.toggle-knob {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  position: absolute;
  top: 3px;
  transition: left .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}

.toggle.on .toggle-knob {
  left: 23px;
}

.toggle.off .toggle-knob {
  left: 3px;
}

.preset-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--g200);
  background: var(--white);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  color: var(--g600);
}

.preset-btn.active {
  background: var(--gold);
  color: #fff;
  border-color: var(--gold);
}

.preset-btn:hover {
  border-color: var(--gold);
}

/* ── Sections ── */
.section-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 4px;
}

.section-desc {
  color: var(--g500);
  font-size: 14px;
  margin-bottom: 20px;
}

.round-tab {
  padding: 7px 14px;
  border-radius: 6px;
  border: none;
  background: none;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  color: var(--g400);
}

.round-tab.active {
  background: var(--gold-bg);
  color: var(--gold);
}

.round-tab:hover {
  color: var(--gold);
}

.footer {
  margin-top: 28px;
  padding: 12px 0;
  border-top: 1px solid var(--g200);
  font-size: 12px;
  color: var(--g400);
}

/* ── Bracket Styles ── */
.bracket-wrap {
  overflow-x: auto;
  padding: 10px 0;
  -webkit-overflow-scrolling: touch;
}

.bracket {
  display: flex;
  align-items: stretch;
  min-height: 520px;
}

.bracket .round {
  display: flex;
  flex-direction: column;
  min-width: 145px;
  position: relative;
}

.bracket .round-header {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--g400);
  text-transform: uppercase;
  letter-spacing: .5px;
  padding: 0 0 8px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--g100);
}

.bracket .gw {
  display: flex;
  flex: 1;
  align-items: center;
  padding: 0 2px;
}

.bracket .game {
  width: 100%;
}

.bracket .slot {
  height: 28px;
  display: flex;
  align-items: center;
  padding: 0 6px;
  font-size: 11px;
  background: var(--white);
  border: 1px solid var(--g200);
  cursor: pointer;
  transition: all .1s;
  gap: 4px;
  user-select: none;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
}

.bracket .slot:first-child {
  border-bottom: none;
  border-radius: 4px 4px 0 0;
}

.bracket .slot:last-child {
  border-radius: 0 0 4px 4px;
}

.bracket .slot:hover {
  background: var(--gold-bg);
  border-color: var(--gold);
}

.bracket .slot.winner {
  background: var(--gold-bg);
  border-color: var(--gold);
  font-weight: 700;
}

.bracket .slot.loser {
  opacity: .35;
}

.bracket .slot.empty {
  background: var(--g50);
  cursor: default;
  color: var(--g300);
}

.bracket .slot.empty:hover {
  background: var(--g50);
  border-color: var(--g200);
}

.bracket .slot .sd {
  font-weight: 800;
  color: var(--gold);
  min-width: 16px;
  text-align: center;
  font-size: 10px;
}

.bracket .slot .tn {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bracket .slot .ow {
  font-size: 9px;
  color: var(--g400);
  margin-left: auto;
  flex-shrink: 0;
}

.bracket .conn {
  display: flex;
  flex-direction: column;
  width: 16px;
  flex-shrink: 0;
}

.bracket .conn-pair {
  display: flex;
  flex: 1;
  flex-direction: column;
}

.bracket .conn-top {
  flex: 1;
  border-right: 1px solid var(--g300);
  border-bottom: 1px solid var(--g300);
}

.bracket .conn-bot {
  flex: 1;
  border-right: 1px solid var(--g300);
  border-top: 1px solid var(--g300);
}

.bracket .conn-line {
  display: flex;
  flex: 1;
  align-items: center;
}

.bracket .conn-line::after {
  content: '';
  width: 100%;
  border-top: 1px solid var(--g300);
}

/* ── Final Four ── */
.ff-bracket {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 20px 0;
  flex-wrap: wrap;
}

.ff-side {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 160px;
}

.ff-game {
  border: 1px solid var(--g200);
  border-radius: 6px;
  overflow: hidden;
}

.ff-slot {
  height: 34px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-size: 13px;
  gap: 6px;
  cursor: pointer;
  transition: all .1s;
  background: var(--white);
}

.ff-slot:first-child {
  border-bottom: 1px solid var(--g200);
}

.ff-slot:hover {
  background: var(--gold-bg);
}

.ff-slot.winner {
  background: var(--gold-bg);
  font-weight: 700;
}

.ff-slot.loser {
  opacity: .35;
}

.ff-slot.empty {
  color: var(--g300);
  cursor: default;
}

.ff-slot .sd {
  font-weight: 800;
  color: var(--gold);
  min-width: 18px;
  font-size: 11px;
}

.ff-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0 24px;
  min-width: 180px;
}

.ff-conn {
  width: 24px;
  display: flex;
  align-items: center;
}

.ff-conn::after {
  content: '';
  width: 100%;
  border-top: 1px solid var(--g300);
}

.champ-box {
  text-align: center;
  border: 2px solid var(--gold);
  border-radius: 8px;
  padding: 14px 20px;
  background: var(--gold-bg);
}

.champ-box .champ-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.champ-box .champ-team {
  font-size: 18px;
  font-weight: 800;
  margin-top: 4px;
}

.champ-box .champ-owner {
  font-size: 12px;
  color: var(--g500);
  margin-top: 2px;
}

/* ── Lobby ── */
.lobby {
  max-width: 480px;
  margin: 80px auto;
  text-align: center;
}

.lobby h1 {
  font-size: 32px;
  font-weight: 900;
  margin-bottom: 4px;
}

.lobby h1 span {
  color: var(--gold);
}

.join-meta { text-align: center; font-size: 13px; color: var(--g500); margin: -8px 0 16px; }
#join-key::placeholder { text-transform: none; }
.join-meta a { color: var(--navy2); font-weight: 700; }
.invite-code { font-family: var(--sans); font-weight: 800; letter-spacing: .12em; font-size: 16px; color: var(--black); }

.lobby-sub {
  color: var(--g500);
  font-size: 15px;
  margin-bottom: 32px;
}

.lobby-card {
  border: 1px solid var(--g200);
  border-radius: 10px;
  padding: 24px;
  margin-bottom: 16px;
  text-align: left;
}

.lobby-card h3 {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 8px;
}

.lobby-card p {
  font-size: 13px;
  color: var(--g500);
  margin-bottom: 14px;
}

.lobby-or {
  color: var(--g300);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 8px 0;
}

.room-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--gold-bg);
  border: 1px solid var(--gold);
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--gold);
  cursor: pointer;
}

.room-badge:hover {
  background: #f5ecd5;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: .4; }
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--black);
  color: var(--white);
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  z-index: 1000;
}

.toast.show {
  opacity: 1;
}

/* ── Install Banner ── */
.install-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--black);
  color: var(--white);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 999;
  box-shadow: 0 -2px 12px rgba(0,0,0,.15);
  animation: slideUp 0.3s ease;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

.install-banner-icon {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  flex-shrink: 0;
}

.install-banner-text {
  flex: 1;
  font-size: 14px;

/* ── Tap States ── */

}

}

/* ── Modal Overlay ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 2000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  transition: opacity .2s;
}

.modal-overlay.show {
  opacity: 1;
}

.modal-box {
  background: var(--white);
  border-radius: 16px;
  padding: 24px;
  max-width: 380px;
  width: 100%;
  box-shadow: 0 12px 40px rgba(0,0,0,.2);
  transform: translateY(20px);
  transition: transform .25s cubic-bezier(.22,1,.36,1);
}

.modal-overlay.show .modal-box {
  transform: translateY(0);
}

.modal-title {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 8px;
}

.modal-msg {
  font-size: 14px;
  color: var(--g600);
  margin-bottom: 18px;
  line-height: 1.5;
  white-space: pre-line;
}

.modal-input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--g200);
  border-radius: 10px;
  font-size: 16px;
  font-family: inherit;
  color: var(--black);
  outline: none;
  margin-bottom: 16px;
  background: var(--g50);
}

.modal-input:focus {
  border-color: var(--gold);
  background: var(--white);
}

.modal-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

.modal-actions .btn {
  min-width: 80px;
  justify-content: center;
  border-radius: 10px;
}

@media (max-width: 700px) {
  .modal-overlay {
    align-items: flex-end;
    padding: 0;
  }

  .modal-box {
    max-width: 100%;
    border-radius: 20px 20px 0 0;
    padding: 24px 20px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%);
  }

  .modal-overlay.show .modal-box {
    transform: translateY(0);
  }
}

/* ── Bottom Navigation ── */
.bottom-nav {
  display: none;
}

@media (max-width: 700px) {
  .bottom-nav {
    display: flex;
    flex-shrink: 0;
    background: var(--white);
    border-top: 1px solid var(--g200);
    padding: 6px 0;
    padding-bottom: calc(6px + env(safe-area-inset-bottom));
    z-index: 100;
  }

  .bottom-nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 4px 0 0;
    border: none;
    background: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 10px;

    content: '';
    position: absolute;
    top: 0;
    left: 25%;
    right: 25%;
    height: 2.5px;
    background: var(--gold);

/* ── Personalization ── */
.slot.mine { border-left: 3px solid var(--gold); }
.ff-slot.mine { border-left: 3px solid var(--gold); }
.region-winner.mine { border: 2px solid var(--gold); background: var(--gold-bg); }

/* ── Editorial theme (2026-11) ──
   Newspaper sports page: white paper, hairline rules instead of cards, Source Serif titles, Libre Franklin
   for text and figures. Navy is the brand, gold marks "you", red means live, each player has a color dot. */
.header { background: rgba(18,48,92,.72); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; border-bottom: 0; flex-wrap: nowrap; padding: 6px 10px; margin: 0 0 0; }
.header.turn { background: var(--m1); color: #1a1300; }
.header-sub { flex: 1; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.75); }
.header.turn .header-sub { color: rgba(26,19,0,.75); }
.header-sub b, .header .room-badge { color: inherit; font-weight: 800; letter-spacing: .02em; }
.header .room-badge { background: none; border: 0; padding: 0; color: #fff; cursor: pointer; font-size: 13px; }
.header.turn .room-badge { color: #1a1300; }
.header .settings-gear { color: rgba(255,255,255,.85); }
.header.turn .settings-gear { color: #1a1300; }
.header .settings-gear:hover { background: rgba(255,255,255,.1); color: #fff; }
.live-tag { color: #FF6B78; font-weight: 800; font-size: 11px; letter-spacing: .08em; margin-left: 8px; }
.header.turn .live-tag { color: #8B0010; }
.live-tag::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: currentColor; margin-right: 5px; vertical-align: 1px; }
.turnbar { display: flex; width: 100%; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--gold-bg); border: 0; border-bottom: 2px solid var(--m1); font: inherit; font-size: 15px; color: var(--black); cursor: pointer; flex-shrink: 0; }
.turnbar span:last-child { color: #7A5600; font-weight: 700; font-size: 13px; }
.top-nav button.active { color: var(--navy); border-bottom-color: var(--navy); }
.top-nav button:not(:disabled):hover { color: var(--navy); }

.page-title { font-family: var(--serif); font-weight: 700; font-size: 30px; line-height: 1.1; padding: 8px 0 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.page-title small, .page-title .text-btn { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--g500); }
.section-title, .lobby h1 { font-family: var(--serif); font-weight: 700; }
.kicker { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--navy); padding: 24px 0 8px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--navy); }
.kicker span { font-weight: 600; color: var(--g500); letter-spacing: 0; text-transform: none; }
.text-btn { background: none; border: 0; font: inherit; color: var(--black); font-weight: 700; cursor: pointer; padding: 0; }
.foot, .empty-note { font-size: 12px; color: var(--g500); padding: 16px 0; line-height: 1.55; }
.you { font-size: 11px; font-weight: 600; color: var(--g500); }

.pdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; flex-shrink: 0; }
.medal { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 13px; line-height: 1; }
.medal.m1 { background: var(--m1); } .medal.m2 { background: var(--m2); } .medal.m3 { background: var(--m3); }
.rank-num { display: inline-block; width: 24px; text-align: center; font-weight: 700; color: var(--g500); }

/* tables as lists */
table.list { width: 100%; border-collapse: collapse; font-size: 15px; }
table.list td, table.list th { padding: 11px 0; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: middle; background: none; }
table.list th { font-size: 11px; font-weight: 700; color: var(--g500); padding: 8px 0 6px; text-transform: none; }
table.list .num { text-align: right; }
table.list .sd { width: 28px; color: var(--g500); font-weight: 600; font-size: 13px; }
table.list .tn { font-weight: 700; }
table.list .st { font-size: 13px; color: var(--g600); }
table.list .pts { font-weight: 800; width: 40px; color: inherit; font-size: inherit; text-align: right; }
table.list tr.out td, table.list tr.out .st { color: var(--g300); }
table.list tr.out .tn { font-weight: 500; }
table.list tr.tap { cursor: pointer; }
table.list tr.tap:active td { background: var(--tint); }
table.list tr.me td, table.list tr.onclock td { background: var(--tint); }
table.list .who { white-space: nowrap; }
.pick-link { font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }
.log td { font-size: 14px; padding: 8px 0; }
.log .pk { width: 40px; color: var(--g500); }
.log tr.new td { background: var(--tint); }
.rosters .st { padding-left: 12px; }

.tabs { display: flex; gap: 18px; align-items: center; padding: 12px 0 0; font-size: 14px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; font: inherit; font-weight: 600; color: var(--g500); padding: 0 0 6px; border-bottom: 2px solid transparent; white-space: nowrap; cursor: pointer; }
.tabs button.on { color: var(--black); border-color: var(--black); }
.tabs sup { font-size: 10px; margin-left: 2px; color: var(--navy2); font-weight: 800; }
.kicker .seed-filter { min-height: 0 !important; padding: 0; border: 0; background: none; font: inherit; font-size: 12px; font-weight: 600; color: var(--g500); text-transform: none; letter-spacing: 0; text-align: right; }

/* draft room */
.turnhead { margin-top: 6px; padding: 14px 16px; background: var(--gold-bg); border-top: 3px solid var(--m1); }
.turnhead .page-title { padding: 0; }
.turnhead .page-title small { color: #7A5600; }
.clock-row { display: flex; justify-content: space-between; align-items: flex-end; padding-top: 10px; min-height: 20px; }
.clock-row .draft-timer { font-size: 56px; font-weight: 300; letter-spacing: -.03em; line-height: .9; padding: 0; text-align: left; color: var(--black); }
.draft-timer[hidden] { display: none; }
.draft-timer.timer-red { color: var(--red); animation: none; }
.draft-timer.paused { color: var(--g400); }
.clock-lbl { font-size: 12px; color: var(--g500); text-align: right; font-weight: 600; margin-left: auto; }

.admin-row { display: flex; gap: 18px; justify-content: center; padding: 22px 0 8px; }
.admin-row button { background: none; border: 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--g500); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.admin-row button.danger { color: var(--red); }
.admin-row button:disabled { opacity: .4; cursor: default; }

/* my teams */
.figs { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; border-top: 1px solid var(--rule); }
.figs.m1 { border-top: 3px solid var(--m1); } .figs.m2 { border-top: 3px solid var(--m2); } .figs.m3 { border-top: 3px solid var(--m3); }
