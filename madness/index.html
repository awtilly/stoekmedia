<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>March Madness Draft</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C5991A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
/* ── Base / Variables ── */
:root {
  --gold: #C5991A;
  --gold-bg: #faf6eb;
  --black: #1a1a1a;
  --white: #fff;
  --g50: #f9f9f9;
  --g100: #f0f0f0;
  --g200: #e0e0e0;
  --g300: #ccc;
  --g400: #999;
  --g500: #777;
  --g600: #555;
  --green: #2d8a4e;
  --red: #c0392b;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  touch-action: manipulation;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--white);
  color: var(--black);
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  padding-top: env(safe-area-inset-top);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* ── Layout ── */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 16px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--g200);
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}

.header h1 {
  font-size: 24px;
  font-weight: 800;
}

.header h1 span {
  color: var(--gold);
}

.header-sub {
  font-size: 13px;
  color: var(--g500);
}

/* ── Nav ── */
.top-nav {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--g200);
  margin-bottom: 24px;
  flex-wrap: wrap;
  overflow-x: auto;
}

.top-nav button {
  padding: 10px 18px;
  border: none;
  background: none;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
  color: var(--g400);
  border-bottom: 2px solid transparent;
  transition: all .15s;
  white-space: nowrap;
}

.top-nav button.active {
  color: var(--gold);
  border-bottom-color: var(--gold);
}

.top-nav button:disabled {
  color: var(--g300);
  cursor: not-allowed;
}

.top-nav button:not(:disabled):hover {
  color: var(--gold);
}

/* ── Cards ── */
.card {
  background: var(--white);
  border: 1px solid var(--g200);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}

.label {
  font-size: 11px;
  font-weight: 700;
  color: var(--g500);
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-bottom: 6px;
  display: block;
}

/* ── Inputs ── */
input, select {
  background: var(--white);
  border: 1px solid var(--g200);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 14px;
  font-family: inherit;
  color: var(--black);
  outline: none;
}

input:focus, select:focus {
  border-color: var(--gold);
}

input[type="number"] {
  width: 80px;
}

textarea {
  background: var(--white);
  border: 1px solid var(--g200);
  border-radius: 6px;
  padding: 10px;
  font-size: 13px;
  font-family: monospace;
  color: var(--black);
  outline: none;
  resize: vertical;
  width: 100%;
}

/* ── Buttons ── */
.btn {
  padding: 8px 18px;
  border-radius: 6px;
  border: 1px solid transparent;
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  font-family: inherit;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.btn:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--gold);
  color: var(--white);
  border-color: var(--gold);
}

.btn-primary:not(:disabled):hover {
  background: #b38a16;
}

.btn-secondary {
  background: var(--white);
  color: var(--g600);
  border-color: var(--g200);
}

.btn-secondary:not(:disabled):hover {
  border-color: var(--g400);
}

.btn-danger {
  background: var(--white);
  color: var(--red);
  border-color: var(--red);
}

.btn-sm {
  padding: 5px 12px;
  font-size: 12px;
}

.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--g400);
  font-size: 14px;
  padding: 6px;
}

.icon-btn:hover {
  color: var(--black);
}

.icon-btn-danger:hover {
  color: var(--red);
}

/* ── Seeds ── */
.seed-badge {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  flex-shrink: 0;
}

.seed-top {
  background: var(--gold);
  color: #fff;
}

.seed-mid {
  background: #d4b85c;
  color: #fff;
}

.seed-low {
  background: var(--g200);
  color: var(--g600);
}

/* ── Grid / Layout Helpers ── */
.row {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 12px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px;
}

.hidden {
  display: none;
}

/* ── Players / Teams ── */
.player-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--g50);
  border-radius: 6px;
  margin-bottom: 4px;
}

.player-num {
  color: var(--gold);
  font-weight: 800;
  font-size: 13px;
  width: 28px;
}

.team-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  padding: 3px 0;
}

/* ── Draft ── */
.draft-grid {
  display: grid;
  grid-template-columns: 1fr 260px;
  gap: 14px;
}

.draft-teams {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 4px;
}

.pick-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  background: var(--white);
  border: 1px solid var(--g200);
  border-radius: 6px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  transition: all .1s;
  color: var(--black);
  width: 100%;
}

.pick-btn:hover {
  background: var(--gold-bg);
  border-color: var(--gold);
}

.pick-btn:disabled {
  cursor: default;
  opacity: .5;
}

.active-pick {
  border-color: var(--gold);
  background: var(--gold-bg);
}

.progress-bar {
  width: 100%;
  height: 4px;
  background: var(--g100);
  border-radius: 2px;
  margin-top: 10px;
}

.progress-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  transition: width .3s;
}

.roster-card {
  border: 1px solid var(--g200);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 6px;
}

.roster-card.active {
  border-color: var(--gold);
  background: var(--gold-bg);
}

/* ── Leaderboard ── */
.podium-card {
  flex: 1;
  min-width: 140px;
  text-align: center;
  padding: 18px;
  border: 1px solid var(--g200);
  border-radius: 8px;
}

.podium-card.first {
  border-color: var(--gold);
  background: var(--gold-bg);
}

.podium-pts {
  font-size: 32px;
  font-weight: 900;
  color: var(--gold);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th, td {
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid var(--g100);
}

th {
  color: var(--g500);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
}

td.pts {
  font-weight: 800;
  color: var(--gold);
  text-align: center;
  font-size: 15px;
}

td.dim {
  color: var(--g300);
  text-align: center;
}

td.val {
  text-align: center;
}

.bar-container {
  flex: 1;
  height: 22px;
  background: var(--g100);
  border-radius: 4px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #d4b85c, var(--gold));
  border-radius: 4px;
  transition: width .4s;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 12px;
  border: 1px solid;
}

.tag-alive {
  background: #f0faf4;
  border-color: #c6f0d5;
}

.tag-elim {
  background: #fdf2f2;
  border-color: #fad4d4;
  opacity: .5;
}

/* ── Live Scores ── */
.live-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}

.live-pulse {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--green);
}

.live-pulse .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}

.score-card {
  display: flex;
  align-items: stretch;
  border: 1px solid var(--g200);
  border-radius: 8px;
  margin-bottom: 8px;
  overflow: hidden;
  transition: border-color .15s;
}

.score-card.live {
  border-color: var(--green);
  border-width: 2px;
}

.score-card.final .score-status {
  color: var(--red);
}

.score-teams {
  flex: 1;
  padding: 10px 12px;
}

.score-team-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 14px;
}

.score-team-row.winner {
  font-weight: 800;
}

.score-team-row.loser {
  opacity: .5;
}

.score-team-row img {
  width: 24px;
  height: 24px;
  object-fit: contain;
  flex-shrink: 0;
}

.score-team-row .team-seed {
  font-size: 11px;
  font-weight: 800;
  color: var(--gold);
  min-width: 16px;
  text-align: center;
}

.score-team-row .team-name {
  flex: 1;
  font-size: 13px;
}

.score-team-row .team-record {
  font-size: 11px;
  color: var(--g400);
}

.score-team-row .team-score {
  font-size: 18px;
  font-weight: 800;
  min-width: 32px;
  text-align: right;
}

.score-meta {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 12px;
  min-width: 90px;
  background: var(--g50);
  border-left: 1px solid var(--g200);
  gap: 2px;
}

.score-status {
  font-size: 12px;
  font-weight: 700;
  color: var(--green);
  text-align: center;
}

.score-time {
  font-size: 11px;
  color: var(--g500);
  text-align: center;
}

.score-broadcast {
  font-size: 10px;
  color: var(--g400);
  text-align: center;
}

.score-note {
  font-size: 10px;
  color: var(--gold);
  font-weight: 600;
  text-align: center;
}

.scores-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 8px;
}

.team-logo-sm {
  width: 20px;
  height: 20px;
  object-fit: contain;
  flex-shrink: 0;
}

.import-espn-card {
  background: linear-gradient(135deg, var(--gold-bg) 0%, var(--white) 100%);
  border: 2px dashed var(--gold);
  border-radius: 10px;
  padding: 20px;
  text-align: center;
  margin-bottom: 16px;
  cursor: pointer;
  transition: all .2s;
}

.import-espn-card:hover {
  border-style: solid;
  background: var(--gold-bg);
}

.import-espn-card h3 {
  font-size: 16px;
  font-weight: 800;
  color: var(--gold);
  margin-bottom: 4px;
}

.import-espn-card p {
  font-size: 13px;
  color: var(--g500);
  margin-bottom: 12px;
}


.live-filter-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}

.live-filter-btn {
  padding: 5px 12px;
  border-radius: 6px;
  border: 1px solid var(--g200);
  background: var(--white);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  color: var(--g600);
}

.live-filter-btn.active {
  background: var(--gold);
  color: var(--white);
  border-color: var(--gold);
}

/* ── Settings ── */
.toggle {
  width: 44px;
  height: 24px;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  position: relative;
  transition: background .2s;
  flex-shrink: 0;
}

.toggle.on {
  background: var(--gold);
}

.toggle.off {
  background: var(--g200);
}

.toggle-knob {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #fff;
  position: absolute;
  top: 3px;
  transition: left .2s;
  box-shadow: 0 1px 3px rgba(0,0,0,.15);
}

.toggle.on .toggle-knob {
  left: 23px;
}

.toggle.off .toggle-knob {
  left: 3px;
}

.preset-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--g200);
  background: var(--white);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  color: var(--g600);
}

.preset-btn.active {
  background: var(--gold);
  color: #fff;
  border-color: var(--gold);
}

.preset-btn:hover {
  border-color: var(--gold);
}

/* ── Sections ── */
.section-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 4px;
}

.section-desc {
  color: var(--g500);
  font-size: 14px;
  margin-bottom: 20px;
}

.round-tab {
  padding: 7px 14px;
  border-radius: 6px;
  border: none;
  background: none;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
  color: var(--g400);
}

.round-tab.active {
  background: var(--gold-bg);
  color: var(--gold);
}

.round-tab:hover {
  color: var(--gold);
}

.footer {
  margin-top: 28px;
  padding: 12px 0;
  border-top: 1px solid var(--g200);
  font-size: 12px;
  color: var(--g400);
}

/* ── Bracket Styles ── */
.bracket-wrap {
  overflow-x: auto;
  padding: 10px 0;
  -webkit-overflow-scrolling: touch;
}

.bracket {
  display: flex;
  align-items: stretch;
  min-height: 520px;
}

.bracket .round {
  display: flex;
  flex-direction: column;
  min-width: 145px;
  position: relative;
}

.bracket .round-header {
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--g400);
  text-transform: uppercase;
  letter-spacing: .5px;
  padding: 0 0 8px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--g100);
}

.bracket .gw {
  display: flex;
  flex: 1;
  align-items: center;
  padding: 0 2px;
}

.bracket .game {
  width: 100%;
}

.bracket .slot {
  height: 28px;
  display: flex;
  align-items: center;
  padding: 0 6px;
  font-size: 11px;
  background: var(--white);
  border: 1px solid var(--g200);
  cursor: pointer;
  transition: all .1s;
  gap: 4px;
  user-select: none;
  position: relative;
  overflow: hidden;
  white-space: nowrap;
}

.bracket .slot:first-child {
  border-bottom: none;
  border-radius: 4px 4px 0 0;
}

.bracket .slot:last-child {
  border-radius: 0 0 4px 4px;
}

.bracket .slot:hover {
  background: var(--gold-bg);
  border-color: var(--gold);
}

.bracket .slot.winner {
  background: var(--gold-bg);
  border-color: var(--gold);
  font-weight: 700;
}

.bracket .slot.loser {
  opacity: .35;
}

.bracket .slot.empty {
  background: var(--g50);
  cursor: default;
  color: var(--g300);
}

.bracket .slot.empty:hover {
  background: var(--g50);
  border-color: var(--g200);
}

.bracket .slot .sd {
  font-weight: 800;
  color: var(--gold);
  min-width: 16px;
  text-align: center;
  font-size: 10px;
}

.bracket .slot .tn {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bracket .slot .ow {
  font-size: 9px;
  color: var(--g400);
  margin-left: auto;
  flex-shrink: 0;
}

.bracket .conn {
  display: flex;
  flex-direction: column;
  width: 16px;
  flex-shrink: 0;
}

.bracket .conn-pair {
  display: flex;
  flex: 1;
  flex-direction: column;
}

.bracket .conn-top {
  flex: 1;
  border-right: 1px solid var(--g300);
  border-bottom: 1px solid var(--g300);
}

.bracket .conn-bot {
  flex: 1;
  border-right: 1px solid var(--g300);
  border-top: 1px solid var(--g300);
}

.bracket .conn-line {
  display: flex;
  flex: 1;
  align-items: center;
}

.bracket .conn-line::after {
  content: '';
  width: 100%;
  border-top: 1px solid var(--g300);
}

/* ── Final Four ── */
.ff-bracket {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  padding: 20px 0;
  flex-wrap: wrap;
}

.ff-side {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 160px;
}

.ff-game {
  border: 1px solid var(--g200);
  border-radius: 6px;
  overflow: hidden;
}

.ff-slot {
  height: 34px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-size: 13px;
  gap: 6px;
  cursor: pointer;
  transition: all .1s;
  background: var(--white);
}

.ff-slot:first-child {
  border-bottom: 1px solid var(--g200);
}

.ff-slot:hover {
  background: var(--gold-bg);
}

.ff-slot.winner {
  background: var(--gold-bg);
  font-weight: 700;
}

.ff-slot.loser {
  opacity: .35;
}

.ff-slot.empty {
  color: var(--g300);
  cursor: default;
}

.ff-slot .sd {
  font-weight: 800;
  color: var(--gold);
  min-width: 18px;
  font-size: 11px;
}

.ff-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 0 24px;
  min-width: 180px;
}

.ff-conn {
  width: 24px;
  display: flex;
  align-items: center;
}

.ff-conn::after {
  content: '';
  width: 100%;
  border-top: 1px solid var(--g300);
}

.champ-box {
  text-align: center;
  border: 2px solid var(--gold);
  border-radius: 8px;
  padding: 14px 20px;
  background: var(--gold-bg);
}

.champ-box .champ-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.champ-box .champ-team {
  font-size: 18px;
  font-weight: 800;
  margin-top: 4px;
}

.champ-box .champ-owner {
  font-size: 12px;
  color: var(--g500);
  margin-top: 2px;
}

/* ── Lobby ── */
.lobby {
  max-width: 480px;
  margin: 80px auto;
  text-align: center;
}

.lobby h1 {
  font-size: 32px;
  font-weight: 900;
  margin-bottom: 4px;
}

.lobby h1 span {
  color: var(--gold);
}

.lobby-sub {
  color: var(--g500);
  font-size: 15px;
  margin-bottom: 32px;
}

.lobby-card {
  border: 1px solid var(--g200);
  border-radius: 10px;
  padding: 24px;
  margin-bottom: 16px;
  text-align: left;
}

.lobby-card h3 {
  font-size: 16px;
  font-weight: 800;
  margin-bottom: 8px;
}

.lobby-card p {
  font-size: 13px;
  color: var(--g500);
  margin-bottom: 14px;
}

.lobby-or {
  color: var(--g300);
  font-size: 13px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 8px 0;
}

.room-badge {
