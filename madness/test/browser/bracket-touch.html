<!doctype html>
<!--
  Browser check for the delegated bracket long-press (js/70-logic.js, js/80-pages.js).
  Run (from repo root):
    python -m http.server 8787 --bind 127.0.0.1
    chrome --headless=new --dump-dom --virtual-time-budget=5000 http://127.0.0.1:8787/madness/test/browser/bracket-touch.html | grep -A30 'id="out"'
  Every line in #out must start with "ok".
-->
<meta charset="utf-8">
<div id="app"><div id="c"></div></div>
<pre id="out"></pre>
<script>
  const fakeFirestore = () => ({ enablePersistence: () => Promise.resolve(), collection: () => ({ doc: () => ({}) }) });
  fakeFirestore.FieldValue = { serverTimestamp: () => 0 };
  window.firebase = { initializeApp() {}, firestore: fakeFirestore, messaging: () => ({}) };
</script>
<script src="../../js/00-constants.js"></script>
<script src="../../js/10-espn.js"></script>
<script src="../../js/20-live.js"></script>
<script src="../../js/30-state.js"></script>
<script src="../../js/40-ui.js"></script>
<script src="../../js/50-auth.js"></script>
<script src="../../js/60-rooms.js"></script>
<script src="../../js/70-logic.js"></script>
<script src="../../js/80-pages.js"></script>
<script>
(async () => {
  const out = [];
  const check = (cond, label) => out.push((cond ? 'ok   ' : 'FAIL ') + label);
  const wait = (ms) => new Promise(r => setTimeout(r, ms));
  const fire = (el, type) => el.dispatchEvent(new Event(type, { bubbles: true, cancelable: true }));

  const teams = [];
  for (const region of REGIONS) for (let seed = 1; seed <= 16; seed++)
    teams.push({ id: region + '-' + seed, name: region + ' ' + seed, seed, region, espnId: '', abbr: 'X', logo: '', record: '' });
  S.teams = teams; S.players = []; S.games = []; S.phase = 'bracket'; S.bracketRegion = 'South';
  for (const r of REGIONS) S.bracket[r][14] = r + '-1';
  S.bracket.South[0] = 'South-1';
  let adminAsks = 0;
  requireAdmin = async () => { adminAsks++; return false; };
  saveState = () => {}; render = () => {};

  const c = document.getElementById('c');
  renderBracket(c);
  const slots = c.querySelectorAll('.slot[data-lp]');
  check(slots.length >= 17, 'region view renders slots with data-lp (' + slots.length + ')');
  check(c.querySelectorAll('[ontouchstart],[ontouchmove],[ontouchend]').length === 0, 'no inline touch handlers remain');
  check(c.querySelector('.slot[data-lp="r:South:0"]') !== null, 'slot carries region and game index');
  check(c.querySelectorAll('.slot.empty[data-lp]').length === 0, 'TBD slots have no long-press target');

  const slot = c.querySelector('.slot[data-lp="r:South:0"]');
  const inner = slot.querySelector('.tn') || slot;
  fire(inner, 'touchstart');
  await wait(600);
  check(adminAsks === 1, 'long press on a slot child reaches clearBracketGame via delegation');
  const endEv = new Event('touchend', { bubbles: true, cancelable: true });
  inner.dispatchEvent(endEv);
  check(endEv.defaultPrevented === true, 'touchend after a long press is prevented (no ghost click)');

  fire(inner, 'touchstart');
  await wait(100);
  fire(inner, 'touchmove');
  await wait(600);
  check(adminAsks === 1, 'touchmove cancels the pending long press');
  const endEv2 = new Event('touchend', { bubbles: true, cancelable: true });
  inner.dispatchEvent(endEv2);
  check(endEv2.defaultPrevented === false, 'touchend after a scroll is not prevented');

  fire(document.body, 'touchstart');
  await wait(600);
  check(adminAsks === 1, 'touchstart outside a slot does nothing');

  S.bracketRegion = 'ff';
  S.bracket.ff[0] = 'South-1'; S.bracket.ff[1] = 'Midwest-1';
  renderBracket(c);
  check(c.querySelectorAll('.ff-slot[data-lp="ff:0"]').length === 2, 'semifinal 1 slots tagged ff:0');
  check(c.querySelectorAll('.ff-slot[data-lp="ff:1"]').length === 2, 'semifinal 2 slots tagged ff:1');
  check(c.querySelectorAll('.ff-slot[data-lp="ff:2"]').length === 2, 'championship slots tagged ff:2');
  check(c.querySelectorAll('[ontouchstart]').length === 0, 'Final Four has no inline touch handlers');
  fire(c.querySelector('.ff-slot[data-lp="ff:2"]'), 'touchstart');
  await wait(600);
  check(adminAsks === 2, 'long press on a championship slot reaches clearFFGame');

  document.getElementById('out').textContent = out.join(String.fromCharCode(10));
})().catch(e => { document.getElementById('out').textContent = 'FAIL exception: ' + e.message; });
</script>
